<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Database UID HB & Scammer</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      
      /* Mode Terang (Clean Slate Light) */
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(255, 255, 255, 0.9);
      --card-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
      
      --text-main: #334155;
      --text-muted: #64748b;
      --text-title: #0f172a;
      
      --tab-bg: #f1f5f9;
      --tab-active-bg: #ffffff;
      --tab-active-text: #4f46e5; /* Electric Indigo */
      --tab-active-shadow: 0 4px 12px rgba(79, 70, 229, 0.12);
      
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-focus: #6366f1;
      
      --item-bg: #ffffff;
      --item-border: #fecdd3;
      --item-badge: #e11d48;
      --item-badge-bg: #fff1f2;
      
      --btn-primary: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      --btn-admin: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      --btn-add: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --btn-delete: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      
      --donate-bg: rgba(254, 243, 199, 0.6);
      --donate-border: rgba(252, 211, 77, 0.7);
      --scrollbar-thumb: #cbd5e1;
    }

    body.dark-mode {
      /* Mode Gelap (Comfortable Midnight Dark) */
      --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 100%);
      --card-bg: rgba(17, 24, 39, 0.82);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      
      --text-main: #cbd5e1;
      --text-muted: #94a3b8;
      --text-title: #f8fafc;
      
      --tab-bg: rgba(15, 23, 42, 0.6);
      --tab-active-bg: #1e293b;
      --tab-active-text: #818cf8;
      --tab-active-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
      
      --input-bg: rgba(15, 23, 42, 0.65);
      --input-border: #334155;
      --input-focus: #818cf8;
      
      --item-bg: #1e293b;
      --item-border: #881337;
      --item-badge: #fda4af;
      --item-badge-bg: rgba(225, 29, 72, 0.18);
      
      --btn-primary: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --btn-admin: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      --btn-add: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --btn-delete: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      
      --donate-bg: rgba(120, 53, 15, 0.2);
      --donate-border: rgba(180, 83, 9, 0.3);
      --scrollbar-thumb: #334155;
    }

    * {
      box-sizing: border-box;
      font-family: var(--font-family);
      margin: 0;
      padding: 0;
    }

    body, .container, .tab-btn, .btn, .result-item, input {
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    /* Fixed Full Screen Layout */
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      background: var(--bg-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
    }

    /* App Interface Container */
    .container {
      width: 100vw;
      height: 100dvh;
      max-width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: none;
      border-radius: 0;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
    }

    @media (min-width: 640px) {
      body {
        padding: 20px;
      }
      .container {
        max-width: 580px;
        height: 100%;
        max-height: 880px;
        border-radius: 24px;
        border: 1px solid var(--card-border);
        box-shadow: var(--card-shadow);
        padding: 24px;
      }
    }

    /* Header & Theme Toggle */
    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-title);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-theme {
      background: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--input-border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-theme:hover {
      transform: translateY(-1px);
    }

    /* Status Bar & Counter */
    .status-bar-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .status-bar {
      font-size: 0.725rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--input-bg);
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--input-border);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .data-counter {
      font-size: 0.725rem;
      font-weight: 600;
      color: var(--text-title);
      background: var(--input-bg);
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid var(--input-border);
      white-space: nowrap;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--tab-bg);
      padding: 4px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: transparent;
      border: none;
      font-size: 0.825rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      border-radius: 8px;
    }

    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      box-shadow: var(--tab-active-shadow);
    }

    /* Inputs & Admin Panel */
    .search-box, .admin-panel {
      flex-shrink: 0;
    }

    .search-box input, .admin-box input {
      width: 100%;
      padding: 12px 16px;
      font-size: 0.875rem;
      background: var(--input-bg);
      color: var(--text-title);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      outline: none;
    }

    .search-box input:focus, .admin-box input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .search-box input::placeholder, .admin-box input::placeholder {
      color: var(--text-muted);
    }

    .admin-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .admin-box {
      display: flex;
      gap: 8px;
    }

    /* Buttons */
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      font-size: 0.825rem;
      font-weight: 600;
      cursor: pointer;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      opacity: 0.95;
    }

    .btn-admin { background: var(--btn-admin); width: 100%; }
    .btn-add { background: var(--btn-add); white-space: nowrap; }
    .btn-delete { background: var(--btn-delete); padding: 5px 8px; font-size: 0.7rem; border-radius: 6px; }

    /* Results Scroll Area */
    .result-list {
      list-style: none;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
    }

    .result-list::-webkit-scrollbar {
      width: 5px;
    }
    .result-list::-webkit-scrollbar-thumb {
      background-color: var(--scrollbar-thumb);
      border-radius: 10px;
    }

    .result-item {
      background: var(--item-bg);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--item-border);
      padding: 12px 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      flex-shrink: 0;
      cursor: pointer;
    }

    .result-item:hover {
      transform: scale(0.995);
    }

    .result-item .number {
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      word-break: break-all;
      color: var(--text-title);
    }

    .right-content {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      background: var(--item-badge-bg);
      color: var(--item-badge);
      border: 1px solid var(--item-border);
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .btn-copy-icon {
      font-size: 0.75rem;
      background: transparent;
      border: none;
      cursor: pointer;
      opacity: 0.6;
    }
    .btn-copy-icon:hover {
      opacity: 1;
    }

    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 24px 12px;
      font-size: 0.85rem;
    }

    /* Card Donasi */
    .donation-section {
      background: var(--donate-bg);
      border: 1px solid var(--donate-border);
      border-radius: 14px;
      padding: 12px 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .donation-text {
      display: flex;
      flex-direction: column;
    }

    .donation-title {
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--text-title);
    }

    .donation-desc {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .donation-action {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qris-img {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      cursor: pointer;
    }

    .btn-donate-link {
      background: #f59e0b;
      color: #ffffff;
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
      white-space: nowrap;
    }

    .btn-donate-link:hover {
      background: #d97706;
    }

    /* Modal QRIS */
    .qris-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100dvh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .qris-modal img {
      max-width: 85%;
      max-height: 75%;
      border-radius: 16px;
      background: #ffffff;
      padding: 12px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      z-index: 2000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-area">
    <h2>🛡️ UID HB & SCAMMER</h2>
    <button id="themeToggleBtn" class="btn-theme" onclick="toggleTheme()">🌙 Gelap</button>
  </div>
  
  <div class="status-bar-container">
    <div id="statusBar" class="status-bar">Memuat data online...</div>
    <div id="dataCounter" class="data-counter">0 Data</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('rekening')">Rekening Scammer</button>
    <button class="tab-btn" onclick="switchTab('genshin')">UID HB Genshin</button>
  </div>

  <div class="admin-panel">
    <button id="authBtn" class="btn btn-admin" onclick="toggleAdmin()">🔑 Mode Pemilik</button>
    
    <div id="addBox" class="admin-box" style="display: none;">
      <input type="text" id="newNumberInput" placeholder="Masukkan nomor/UID baru..." onkeydown="handleInputKeyDown(event)">
      <button class="btn btn-add" id="btnAdd" onclick="addNumber()">+ Tambah</button>
    </div>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Cari Rekening/ E-Wallet Scammer..." oninput="filterData()">
  </div>

  <ul class="result-list" id="resultList"></ul>

  <!-- DONASI CARD -->
  <div class="donation-section">
    <div class="donation-text">
      <span class="donation-title">☕ Dukung Capllang</span>
      <span class="donation-desc">Bantu server tetap aktif.</span>
    </div>
    <div class="donation-action">
      <img src="https://www.image2url.com/r2/default/images/1786971411556-c9bfbe24-e071-424f-b555-dc1d949db21d.jpg" alt="Scan QRIS" class="qris-img" onclick="openQrisModal(this.src)" title="Perbesar QRIS">
      <a href="https://saweria.co/capllang/" target="_blank" rel="noopener noreferrer" class="btn-donate-link">
        Saweria
      </a>
    </div>
  </div>
</div>

<!-- Modal QRIS -->
<div id="qrisModal" class="qris-modal" onclick="closeQrisModal()">
  <img id="modalImg" src="" alt="QRIS Preview">
</div>

<!-- Toast Container -->
<div id="toast" class="toast">Berhasil disalin!</div>

<script>
  // ================= KONFIGURASI JSONBIN =================
  const BIN_ID = "6a82d21cda38895dfeee1ef0"; 
  const READ_ONLY_API_KEY = "$2a$10$VsDc7DpbRTXnkVt4VQYDsecbPuhhHzwazm.WBDYKaJuSHGclKtBem"; 
  let masterApiKey = ""; 
  const HASH_PASSWORD_PEMILIK = "cdf291694fe40299afebc7c4b8796923a8eeff1a88413c9a8185fba3cb69e6de"; 
  const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

  let database = { rekening: [], genshin: [] };
  let isAdmin = false;
  let activeTab = 'rekening';

  async function fetchOnlineDatabase() {
    const status = document.getElementById('statusBar');
    try {
      status.innerText = "⏳ Memperbarui server...";
      const res = await fetch(`${BASE_URL}/latest`, {
        headers: { 'X-Access-Key': READ_ONLY_API_KEY }
      });
      if (!res.ok) throw new Error("Gagal terhubung ke JSONBin");
      
      const data = await res.json();
      if (data.record && Array.isArray(data.record.rekening) && Array.isArray(data.record.genshin)) {
        database = data.record;
        localStorage.setItem('cached_scammer_db', JSON.stringify(database));
        status.innerText = "🟢 Terhubung ke database";
      } else {
        throw new Error("Format data tidak sesuai");
      }
    } catch (err) {
      console.warn("Menggunakan cache lokal:", err);
      const cached = localStorage.getItem('cached_scammer_db');
      if (cached) {
        try {
          database = JSON.parse(cached);
        } catch(e) {
          database = { rekening: [], genshin: [] };
        }
      }
      status.innerText = "🔴 Mode Offline (Data Lokal)";
    }
    filterData();
  }

  async function saveOnlineDatabase() {
    const status = document.getElementById('statusBar');
    status.innerText = "⏳ Menyimpan data...";
    
    if (!masterApiKey) {
      alert("Master Key belum diisi. Silakan login kembali ke Mode Pemilik.");
      return false;
    }

    try {
      const res = await fetch(BASE_URL, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': masterApiKey
        },
        body: JSON.stringify(database)
      });
      
      if (!res.ok) throw new Error("Gagal menyimpan data");
      
      localStorage.setItem('cached_scammer_db', JSON.stringify(database));
      status.innerText = "🟢 Tersimpan di server!";
      return true;
    } catch (err) {
      alert("Gagal memperbarui server online. Periksa koneksi atau Master Key.");
      status.innerText = "⚠️ Simpan gagal";
      return false;
    }
  }

  async function hashString(str) {
    const encoder = new TextEncoder();
    const data = encoder.encode(str);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function toggleAdmin() {
    if (!isAdmin) {
      const inputPass = prompt("Masukkan Kata Sandi Pemilik:");
      if (inputPass !== null && inputPass.trim() !== "") {
        const hashedInput = await hashString(inputPass.trim());
        if (hashedInput === HASH_PASSWORD_PEMILIK) {
          const inputMasterKey = prompt("Masukkan Master Key JSONBin:");
          if (inputMasterKey && inputMasterKey.trim() !== "") {
            masterApiKey = inputMasterKey.trim();
            isAdmin = true;
            document.getElementById('authBtn').innerText = "🔓 Keluar Mode Pemilik";
            document.getElementById('addBox').style.display = "flex";
            showToast("Mode Pemilik Aktif");
          } else if (inputMasterKey !== null) {
            alert("Master Key wajib diisi!");
          }
        } else {
          alert("Kata sandi salah!");
        }
      }
    } else {
      isAdmin = false;
      masterApiKey = "";
      document.getElementById('authBtn').innerText = "🔑 Mode Pemilik";
      document.getElementById('addBox').style.display = "none";
      showToast("Keluar Mode Pemilik");
    }
    filterData();
  }

  function handleInputKeyDown(e) {
    if (e.key === 'Enter') {
      addNumber();
    }
  }

  async function addNumber() {
    const input = document.getElementById('newNumberInput');
    const btnAdd = document.getElementById('btnAdd');
    const val = input.value.trim();

    if (!val) {
      alert("Nomor tidak boleh kosong!");
      return;
    }

    const exists = database[activeTab].some(item => item.toLowerCase() === val.toLowerCase());
    if (exists) {
      alert("Nomor/UID ini sudah ada di database!");
      return;
    }

    btnAdd.disabled = true;
    database[activeTab].push(val);
    
    const success = await saveOnlineDatabase();
    if (success) {
      input.value = "";
      filterData();
      showToast("Data berhasil ditambahkan!");
    } else {
      database[activeTab].pop();
    }
    btnAdd.disabled = false;
  }

  async function deleteNumber(nomor, event) {
    if (event) event.stopPropagation();
    if (confirm(`Hapus ${nomor} dari database?`)) {
      const index = database[activeTab].indexOf(nomor);
      if (index > -1) {
        const originalData = [...database[activeTab]];
        database[activeTab].splice(index, 1);
        
        const success = await saveOnlineDatabase();
        if (success) {
          filterData();
          showToast("Data dihapus!");
        } else {
          database[activeTab] = originalData;
        }
      }
    }
  }

  function switchTab(tab) {
    activeTab = tab;
    
    const buttons = document.querySelectorAll('.tab-btn');
    buttons[0].classList.toggle('active', tab === 'rekening');
    buttons[1].classList.toggle('active', tab === 'genshin');

    const input = document.getElementById('searchInput');
    input.placeholder = tab === 'rekening' 
      ? "Cari Rekening/ E-Wallet..." 
      : "Cari UID HB Genshin Impact...";
    input.value = "";

    filterData();
  }

  function filterData() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const resultList = document.getElementById('resultList');
    const counter = document.getElementById('dataCounter');
    resultList.innerHTML = "";

    const currentData = database[activeTab] || [];
    const filtered = currentData.filter(nomor => nomor.toLowerCase().includes(query));

    counter.innerText = `${filtered.length} Data`;

    if (filtered.length === 0) {
      resultList.innerHTML = `<li class="empty-msg">Tidak ada data ditemukan.</li>`;
      return;
    }

    filtered.forEach(nomor => {
      const li = document.createElement('li');
      li.className = 'result-item';
      li.onclick = () => copyToClipboard(nomor);
      li.title = "Klik untuk menyalin nomor";

      const spanNumber = document.createElement('span');
      spanNumber.className = 'number';
      spanNumber.textContent = nomor;

      const rightContent = document.createElement('div');
      rightContent.className = 'right-content';
      rightContent.innerHTML = `
        <span class="badge">Waspada</span>
        <button class="btn-copy-icon" title="Salin">📋</button>
      `;

      if (isAdmin) {
        const btnDelete = document.createElement('button');
        btnDelete.className = 'btn btn-delete';
        btnDelete.textContent = 'Hapus';
        btnDelete.onclick = (e) => deleteNumber(nomor, e);
        rightContent.appendChild(btnDelete);
      }

      li.appendChild(spanNumber);
      li.appendChild(rightContent);
      resultList.appendChild(li);
    });
  }

  function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => {
      showToast(`Disalin: ${text}`);
    }).catch(() => {
      showToast("Gagal menyalin teks.");
    });
  }

  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, 2200);
  }

  function initTheme() {
    const savedTheme = localStorage.getItem('theme_preference');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark-mode');
      document.getElementById('themeToggleBtn').innerHTML = "☀️ Terang";
    }
  }

  function toggleTheme() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    document.getElementById('themeToggleBtn').innerHTML = isDark ? "☀️ Terang" : "🌙 Gelap";
    localStorage.setItem('theme_preference', isDark ? 'dark' : 'light');
  }

  function openQrisModal(src) {
    document.getElementById('modalImg').src = src;
    document.getElementById('qrisModal').style.display = 'flex';
  }

  function closeQrisModal() {
    document.getElementById('qrisModal').style.display = 'none';
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeQrisModal();
  });

  initTheme();
  fetchOnlineDatabase();
</script>

</body>
</html>
