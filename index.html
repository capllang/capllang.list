<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Database UID HB & Scammer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      
      /* Mode Terang (Default) */
      --outer-bg: #1e293b; 
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(255, 255, 255, 0.9);
      --card-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
      
      --text-main: #334155;
      --text-muted: #64748b;
      --text-title: #0f172a;
      
      --tab-bg: #f1f5f9;
      --tab-active-bg: #ffffff;
      --tab-active-text: #4f46e5;
      --tab-active-shadow: 0 4px 12px rgba(79, 70, 229, 0.12);
      
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-focus: #6366f1;
      
      --item-bg: #ffffff;
      --item-border: #fecdd3;
      
      --date-badge: #64748b;
      --date-badge-bg: #f1f5f9;

      --meta-badge: #4338ca;
      --meta-badge-bg: #eef2ff;
      --meta-badge-border: #c7d2fe;
      
      --btn-primary: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      --btn-admin: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      --btn-add: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --btn-delete: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      
      --donate-bg: rgba(254, 243, 199, 0.6);
      --donate-border: rgba(252, 211, 77, 0.7);
      --scrollbar-thumb: #cbd5e1;
    }

    body.dark-mode {
      /* Mode Gelap */
      --outer-bg: #e2e8f0; 
      --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 100%);
      --card-bg: rgba(17, 24, 39, 0.82);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      
      --text-main: #cbd5e1;
      --text-muted: #94a3b8;
      --text-title: #f8fafc;
      
      --tab-bg: rgba(15, 23, 42, 0.6);
      --tab-active-bg: #1e293b;
      --tab-active-text: #818cf8;
      --tab-active-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
      
      --input-bg: rgba(15, 23, 42, 0.65);
      --input-border: #334155;
      --input-focus: #818cf8;
      
      --item-bg: #1e293b;
      --item-border: #881337;
      
      --date-badge: #cbd5e1;
      --date-badge-bg: rgba(15, 23, 42, 0.5);

      --meta-badge: #a5b4fc;
      --meta-badge-bg: rgba(99, 102, 241, 0.18);
      --meta-badge-border: #4338ca;
      
      --btn-primary: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --btn-admin: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      --btn-add: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --btn-delete: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      
      --donate-bg: rgba(120, 53, 15, 0.2);
      --donate-border: rgba(180, 83, 9, 0.3);
      --scrollbar-thumb: #334155;
    }

    * {
      box-sizing: border-box;
      font-family: var(--font-family);
      margin: 0;
      padding: 0;
    }

    body, .container, .tab-btn, .btn, .result-item, input, textarea, select {
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      background: var(--outer-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      height: 92dvh;
      max-height: 850px;
      background: var(--bg-gradient);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
    }

    @media (min-width: 640px) {
      body {
        padding: 24px;
      }
      .container {
        max-width: 540px;
        height: 88dvh;
        border-radius: 24px;
        padding: 24px;
      }
    }

    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(156, 163, 175, 0.12);
      flex-shrink: 0;
    }

    h2 {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-title);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    h2:hover {
      opacity: 0.75;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-theme, .btn-header-admin {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--input-border);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-theme:hover, .btn-header-admin:hover {
      background: var(--input-border);
      color: var(--text-title);
    }

    .status-bar-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .status-bar {
      font-size: 0.725rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--input-bg);
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--input-border);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .data-counter {
      font-size: 0.725rem;
      font-weight: 600;
      color: var(--text-title);
      background: var(--input-bg);
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid var(--input-border);
      white-space: nowrap;
    }

    .last-updated-wrapper {
      width: 100%;
      overflow: hidden;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 8px 16px;
      flex-shrink: 0;
      display: flex;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
      position: relative;
      mask-image: linear-gradient(to right, transparent, black 3%, black 97%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 3%, black 97%, transparent);
    }

    .marquee-track {
      display: inline-block;
      white-space: nowrap;
      will-change: transform;
      animation: scrollLoop 30s linear infinite;
    }

    .last-updated-wrapper:hover .marquee-track {
      animation-play-state: paused;
    }

    .marquee-content {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-main);
      padding-right: 50px;
    }

    @keyframes scrollLoop {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .tabs {
      display: flex;
      background: var(--tab-bg);
      padding: 4px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: transparent;
      border: none;
      font-size: 0.825rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      border-radius: 8px;
    }

    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      box-shadow: var(--tab-active-shadow);
    }

    .search-box, .admin-panel {
      flex-shrink: 0;
    }

    .search-box input, .admin-box input, .admin-box textarea, .admin-box select {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.825rem;
      background: var(--input-bg);
      color: var(--text-title);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      outline: none;
    }

    .admin-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .admin-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--input-bg);
      border: 1px dashed var(--input-focus);
      padding: 8px 10px;
      border-radius: 12px;
      max-height: 250px;
      overflow-y: auto;
    }

    .admin-box textarea {
      resize: none;
      height: 32px;
      min-height: 32px;
      padding: 5px 8px;
      font-size: 0.75rem;
    }

    .admin-inputs {
      display: flex;
      gap: 6px;
      width: 100%;
      flex-wrap: wrap;
    }

    .admin-inputs input, .admin-inputs select {
      padding: 7px 10px;
      font-size: 0.78rem;
    }

    .search-box input:focus, .admin-box input:focus, .admin-box textarea:focus, .admin-box select:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-add { background: var(--btn-add); width: 100%; padding: 8px 16px; }
    .btn-delete { background: var(--btn-delete); padding: 5px 8px; font-size: 0.7rem; border-radius: 6px; }
    
    .btn-load-more {
      background: var(--btn-admin);
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.8rem;
    }

    .result-list {
      list-style: none;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
      scroll-behavior: smooth;
    }

    .result-list::-webkit-scrollbar {
      width: 5px;
    }
    .result-list::-webkit-scrollbar-thumb {
      background-color: var(--scrollbar-thumb);
      border-radius: 10px;
    }

    .result-item {
      background: var(--item-bg);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--item-border);
      padding: 12px 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      flex-shrink: 0;
      cursor: pointer;
    }

    .result-item .number {
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      word-break: break-all;
      color: var(--text-title);
    }

    .right-content {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge-date {
      background: var(--date-badge-bg);
      color: var(--date-badge);
      border: 1px solid var(--input-border);
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-meta {
      background: var(--meta-badge-bg);
      color: var(--meta-badge);
      border: 1px solid var(--meta-badge-border);
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 700;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--input-border);
      border-radius: 6px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      cursor: pointer;
      color: var(--text-muted);
    }
    .btn-icon:hover {
      background: var(--input-border);
      color: var(--text-title);
    }

    .empty-msg, .load-more-container {
      text-align: center;
      color: var(--text-muted);
      padding: 12px;
      font-size: 0.85rem;
      list-style: none;
    }

    .donation-section {
      background: var(--donate-bg);
      border: 1px solid var(--donate-border);
      border-radius: 14px;
      padding: 12px 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .donation-title { font-weight: 700; font-size: 0.8rem; color: var(--text-title); }
    .donation-desc { font-size: 0.7rem; color: var(--text-muted); }
    .donation-action { display: flex; align-items: center; gap: 10px; }
    
    .qris-img {
      width: 36px; height: 36px; object-fit: cover;
      border-radius: 8px; border: 1px solid var(--card-border); cursor: pointer;
    }
    .btn-donate-link {
      background: #f59e0b; color: #ffffff; padding: 6px 12px;
      font-size: 0.75rem; font-weight: 600; text-decoration: none;
      border-radius: 10px; white-space: nowrap;
    }

    .qris-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 1000;
    }
    .qris-modal img {
      max-width: 85%; max-height: 75%; border-radius: 16px; background: #ffffff;
      padding: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }

    .admin-modal-content {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      padding: 20px;
      border-radius: 16px;
      width: 90%;
      max-width: 320px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.95); color: #ffffff; padding: 8px 18px; border-radius: 20px;
      font-size: 0.75rem; font-weight: 500; opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; z-index: 2000;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>

<script>
const PROXY_URL = "https://jsonbin-proxy.awak-cot-u-sibak.workers.dev";
let adminSecretKey = null;
let database = { rekening: [], genshin: [], lastUpdated: null, infoTambahan: [] };
let isAdmin = false;
let activeTab = 'rekening';
let searchTimeout = null;
let renderLimit = 50;

const BANK_OPTIONS = ["BCA", "BRI", "Mandiri", "BNI", "BSI", "DANA", "OVO", "GoPay", "ShopeePay", "Seabank", "Jago", "Blu", "Lainnya..."];
const GAME_OPTIONS = ["Genshin Impact", "Honkai: Star Rail", "Zenless Zone Zero", "Mobile Legends", "Free Fire", "PUBG Mobile", "Roblox", "Valorant", "Lainnya..."];

function migrateData(dataArray) {
  if (!Array.isArray(dataArray)) return [];
  return dataArray.map(item => {
    if (item === null || item === undefined) return { nomor: "-", tanggal: "-", meta: "-" };
    if (typeof item !== 'object') return { nomor: String(item), tanggal: "-", meta: "-" };
    return {
      nomor: item.nomor ? String(item.nomor) : "",
      tanggal: item.tanggal ? String(item.tanggal) : "-",
      meta: (item.meta || item.bank || item.game) ? String(item.meta || item.bank || item.game) : "-"
    };
  });
}

function updateMetaSelectOptions() {
  const select = document.getElementById('metaSelectInput');
  const customInput = document.getElementById('metaCustomInput');
  if (!select) return;
  
  select.innerHTML = '';
  
  // Opsi Kosong (Default Placeholder)
  const defaultOpt = document.createElement('option');
  defaultOpt.value = "";
  defaultOpt.textContent = activeTab === 'rekening' ? "-- Pilih Bank (Opsional) --" : "-- Pilih Game (Opsional) --";
  defaultOpt.selected = true;
  select.appendChild(defaultOpt);

  const options = activeTab === 'rekening' ? BANK_OPTIONS : GAME_OPTIONS;
  options.forEach(opt => {
    const el = document.createElement('option');
    el.value = opt;
    el.textContent = opt;
    select.appendChild(el);
  });
  
  customInput.style.display = 'none';
  customInput.value = '';
}

function handleMetaSelectChange(selectEl) {
  const customInput = document.getElementById('metaCustomInput');
  if (selectEl.value === 'Lainnya...') {
    customInput.style.display = 'block';
    customInput.focus();
  } else {
    customInput.style.display = 'none';
    customInput.value = '';
  }
}

function toggleTheme() {
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  document.getElementById('themeToggleBtn').textContent = isDark ? 'Light' : 'Dark';
}

if (localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark-mode');
  document.getElementById('themeToggleBtn').textContent = 'Light';
}

function formatLastUpdated(timestamp, infoTambahanArr) {
  if (!timestamp) return "Diperbarui: -";
  const date = new Date(timestamp);
  const timeStr = isNaN(date.getTime()) ? timestamp : `${date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })} pukul ${date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })} WIB`;
  
  let resultText = `🕒 Database Update: ${timeStr}`;
  
  let validInfos = [];
  if (Array.isArray(infoTambahanArr)) {
    validInfos = infoTambahanArr.map(i => i ? String(i).trim() : "").filter(i => i !== "");
  } else if (typeof infoTambahanArr === 'string' && infoTambahanArr.trim() !== "") {
    validInfos = [infoTambahanArr.trim()];
  }

  if (validInfos.length > 0) {
    resultText += `  |  📢 Info: ${validInfos.join("  •  ")}`;
  }
  return resultText;
}

function updateLastUpdatedUI() {
  const baseText = database.lastUpdated ? formatLastUpdated(database.lastUpdated, database.infoTambahan) : "Diperbarui: -";
  document.getElementById('lastUpdated1').textContent = baseText;
  document.getElementById('lastUpdated2').textContent = baseText;
}

function resetToHome() {
  window.history.replaceState({}, '', window.location.pathname);
  document.getElementById('searchInput').value = '';
  switchTab('rekening');
  const resultList = document.getElementById('resultList');
  if(resultList) resultList.scrollTop = 0;
  showToast("Kembali ke Halaman Utama");
}

async function fetchOnlineDatabase() {
  const status = document.getElementById('statusBar');
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 5000);

  try {
    status.innerText = "⏳ Memperbarui server...";
    const res = await fetch(PROXY_URL, { signal: controller.signal });
    clearTimeout(timeoutId);

    if (!res.ok) throw new Error("Gagal terhubung ke Worker");
    
    const data = await res.json();
    const actualData = data.record ? data.record : data;

    if (actualData && Array.isArray(actualData.rekening) && Array.isArray(actualData.genshin)) {
      database = actualData;
      database.rekening = migrateData(database.rekening);
      database.genshin = migrateData(database.genshin);
      if (!Array.isArray(database.infoTambahan)) {
        database.infoTambahan = database.infoTambahan ? [database.infoTambahan] : [];
      }
      
      localStorage.setItem('cached_scammer_db', JSON.stringify(database));
      status.innerText = "🟢 Koneksi aman: Database optimal.";
    } else {
      throw new Error("Format struktur data tidak sesuai");
    }
  } catch (err) {
    console.warn("Menggunakan cache lokal:", err);
    const cached = localStorage.getItem('cached_scammer_db');
    if (cached) {
      try { 
        database = JSON.parse(cached); 
        database.rekening = migrateData(database.rekening || []);
        database.genshin = migrateData(database.genshin || []);
        if (!Array.isArray(database.infoTambahan)) {
          database.infoTambahan = database.infoTambahan ? [database.infoTambahan] : [];
        }
      } catch(e) { 
        database = { rekening: [], genshin: [], lastUpdated: null, infoTambahan: [] }; 
      }
    }
    status.innerText = "🔴 Mode Offline (Data Lokal)";
  }
  
  updateLastUpdatedUI();
  checkUrlParams();
  updateMetaSelectOptions();
  filterData();
}

async function saveOnlineDatabase() {
  const status = document.getElementById('statusBar');
  status.innerText = "⏳ Menyimpan data...";
  
  if (!adminSecretKey) {
    alert("Sesi Admin telah berakhir. Silakan login kembali.");
    exitAdminMode();
    return false;
  }

  database.lastUpdated = new Date().toISOString();

  try {
    const cleanSecret = String(adminSecretKey).trim();
    const res = await fetch(PROXY_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Admin-Secret': cleanSecret
      },
      body: JSON.stringify(database)
    });
    
    if (res.status === 401 || res.status === 403) {
      alert("🔒 Password Admin Salah atau Sesi Ditolak!");
      exitAdminMode();
      status.innerText = "⚠️ Autentikasi Gagal";
      return false;
    }

    if (!res.ok) throw new Error("Gagal menyimpan data ke server");
    
    localStorage.setItem('cached_scammer_db', JSON.stringify(database));
    status.innerText = "🟢 Tersimpan di server!";
    updateLastUpdatedUI();
    return true;
  } catch (err) {
    alert("⚠️ Gagal memperbarui server: Akses ditolak atau masalah jaringan.");
    status.innerText = "⚠️ Simpan gagal";
    return false;
  }
}

function exitAdminMode() {
  isAdmin = false;
  adminSecretKey = null;
  document.getElementById('authBtn').innerText = "🔑 Mode Pemilik";
  document.getElementById('addBox').style.display = "none";
  document.getElementById('runningTextWrapper').style.display = "flex";
  filterData();
}

function toggleAdmin() {
  if (!isAdmin) {
    document.getElementById('adminModal').style.display = 'flex';
    const pwdInput = document.getElementById('adminPasswordInput');
    pwdInput.value = '';
    pwdInput.focus();
  } else {
    exitAdminMode();
    showToast("Keluar Mode Pemilik");
  }
}

function closeAdminModal() {
  document.getElementById('adminModal').style.display = 'none';
}

function handleAdminModalKeyDown(e) {
  if (e.key === 'Enter') {
    submitAdminLogin();
  }
}

async function submitAdminLogin() {
  const inputSecret = document.getElementById('adminPasswordInput').value;

  if (!inputSecret || inputSecret.trim() === "") {
    alert("⚠️ Password Admin wajib diisi!");
    return;
  }

  const cleanSecret = inputSecret.trim();

  // Tampilkan indikator loading pada tombol masuk Modal
  const submitBtn = document.querySelector('#adminModal .btn-add');
  const originalBtnText = submitBtn.innerText;
  submitBtn.disabled = true;
  submitBtn.innerText = "Verifikasi...";

  try {
    // Verifikasi password langsung ke server Cloudflare Worker
    const res = await fetch(PROXY_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Admin-Secret': cleanSecret
      },
      body: JSON.stringify(database)
    });

    if (res.status === 401 || res.status === 403) {
      alert("❌ Password Admin Salah! Akses ditolak.");
      return;
    }

    if (!res.ok) throw new Error("Gagal verifikasi ke server");

    // Jika verifikasi sukses (password benar):
    adminSecretKey = cleanSecret;
    isAdmin = true;

    document.getElementById('authBtn').innerText = "🔓 Keluar Mode";
    document.getElementById('addBox').style.display = "flex";
    document.getElementById('runningTextWrapper').style.display = "none";
    document.getElementById('newDateInput').valueAsDate = new Date();

    updateMetaSelectOptions();

    for (let i = 1; i <= 5; i++) {
      const val = (database.infoTambahan && database.infoTambahan[i - 1]) ? database.infoTambahan[i - 1] : "";
      document.getElementById(`infoTambahan${i}`).value = val;
    }

    closeAdminModal();
    showToast("Mode Pemilik Aktif");
    filterData();

  } catch (err) {
    alert("⚠️ Gagal verifikasi: Terjadi kesalahan jaringan atau server.");
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerText = originalBtnText;
  }
}

function handleInputKeyDown(e) {
  if (e.key === 'Enter') addNumber();
}

async function addNumber() {
  const input = document.getElementById('newNumberInput');
  const dateInput = document.getElementById('newDateInput');
  const btnAdd = document.getElementById('btnAdd');
  const selectMeta = document.getElementById('metaSelectInput');
  const customMetaInput = document.getElementById('metaCustomInput');
  
  let selectedMeta = selectMeta.value;
  
  let newInfoArr = [];
  for (let i = 1; i <= 5; i++) {
    newInfoArr.push(document.getElementById(`infoTambahan${i}`).value.trim());
  }
  database.infoTambahan = newInfoArr;

  const rawVal = input.value.trim();
  const dateVal = dateInput.value;
  const hasInfo = newInfoArr.some(inf => inf !== "");

  if (!rawVal) {
    if (!hasInfo) {
      alert("⚠️ Masukkan nomor/UID baru atau isi setidaknya satu info tambahan!");
      return;
    }
    btnAdd.disabled = true;
    btnAdd.innerText = "⏳ Menyimpan Info...";
    
    const success = await saveOnlineDatabase();
    if (success) {
      showToast("Info tambahan berhasil diperbarui!");
    }
    btnAdd.disabled = false;
    btnAdd.innerText = "+ Simpan Data";
    return;
  }

  if (!selectedMeta || selectedMeta === "") {
    selectedMeta = "-";
  } else if (selectedMeta === 'Lainnya...') {
    selectedMeta = customMetaInput.value.trim();
    if (!selectedMeta) {
      selectedMeta = "-";
    }
  }

  if (!dateVal) {
    alert("⚠️ Tanggal wajib diisi jika menambahkan nomor!");
    return;
  }

  const cleanVal = rawVal.replace(/\D/g, '');

  if (activeTab === 'genshin') {
    if (!/^\d{5,12}$/.test(cleanVal)) {
      alert("⚠️ UID Game tidak valid!\nUID harus berupa angka dengan panjang 5 - 12 digit.");
      return;
    }
  } else if (activeTab === 'rekening') {
    if (!/^\d{5,25}$/.test(cleanVal)) {
      alert("⚠️ Nomor Rekening/E-Wallet tidak valid!\nHarus berupa angka dengan panjang minimal 5 digit.");
      return;
    }
  }

  const exists = database[activeTab].some(item => {
    const num = typeof item === 'object' ? item.nomor : item;
    return String(num) === cleanVal;
  });

  if (exists) {
    alert("⚠️ Nomor/UID ini sudah ada di dalam database!");
    return;
  }

  btnAdd.disabled = true;
  btnAdd.innerText = "⏳ Menyimpan...";
  
  const newItem = { nomor: cleanVal, tanggal: dateVal, meta: selectedMeta };
  database[activeTab].unshift(newItem);
  
  const success = await saveOnlineDatabase();
  if (success) {
    input.value = "";
    customMetaInput.value = "";
    updateMetaSelectOptions();
    document.getElementById('searchInput').value = "";
    renderLimit = 50;
    filterData();
    showToast("Data & info berhasil ditambahkan!");
  } else {
    database[activeTab].shift();
  }
  
  btnAdd.disabled = false;
  btnAdd.innerText = "+ Simpan Data";
}

async function deleteNumber(itemObj, btnEl) {
  const nomorStr = typeof itemObj === 'object' ? String(itemObj.nomor) : String(itemObj);
  
  if (confirm(`Hapus ${nomorStr} dari database?`)) {
    const index = database[activeTab].indexOf(itemObj);
    if (index > -1) {
      if (btnEl) btnEl.disabled = true;
      
      const originalData = [...database[activeTab]];
      database[activeTab].splice(index, 1);
      
      const success = await saveOnlineDatabase();
      if (success) {
        filterData();
        showToast("Data dihapus!");
      } else {
        database[activeTab] = originalData;
        if (btnEl) btnEl.disabled = false;
      }
    }
  }
}

function switchTab(tab) {
  activeTab = tab;
  renderLimit = 50;
  document.getElementById('tabRekening').classList.toggle('active', tab === 'rekening');
  document.getElementById('tabGenshin').classList.toggle('active', tab === 'genshin');

  const input = document.getElementById('searchInput');
  input.placeholder = tab === 'rekening' 
    ? "Cari Rekening/ Bank/ E-Wallet Scammer..." 
    : "Cari UID / Game HB...";

  updateMetaSelectOptions();
  filterData();
}

function checkUrlParams() {
  const urlParams = new URLSearchParams(window.location.search);
  const searchQuery = urlParams.get('search') || urlParams.get('q');
  const tabQuery = urlParams.get('tab');

  if (tabQuery && (tabQuery === 'rekening' || tabQuery === 'genshin')) {
    activeTab = tabQuery;
    document.getElementById('tabRekening').classList.toggle('active', activeTab === 'rekening');
    document.getElementById('tabGenshin').classList.toggle('active', activeTab === 'genshin');
  }
  if (searchQuery) {
    document.getElementById('searchInput').value = searchQuery;
  }
}

function updateUrlParam(query) {
  const url = new URL(window.location.href);
  if (query) {
    url.searchParams.set('search', query);
  } else {
    url.searchParams.delete('search');
  }
  window.history.replaceState({}, '', url.toString());
}

document.getElementById('resultList').addEventListener('click', (e) => {
  const target = e.target;
  const itemEl = target.closest('.result-item');
  
  if (target.classList.contains('btn-load-more')) {
    renderLimit += 50;
    filterData();
    return;
  }

  if (!itemEl) return;
  const nomorStr = itemEl.dataset.nomor;
  const itemObj = database[activeTab].find(i => (typeof i === 'object' ? String(i.nomor) : String(i)) === nomorStr);

  if (target.classList.contains('btn-delete')) {
    e.stopPropagation();
    deleteNumber(itemObj, target);
  } else if (target.classList.contains('btn-icon')) {
    e.stopPropagation();
    copyReportTemplate(itemObj || nomorStr);
  } else {
    copyToClipboard(nomorStr, `Disalin: ${nomorStr}`);
  }
});

function copyReportTemplate(itemObj) {
  const nomorStr = typeof itemObj === 'object' ? itemObj.nomor : itemObj;
  const metaStr = typeof itemObj === 'object' ? (itemObj.meta || itemObj.bank || itemObj.game || '-') : '-';
  const tanggalStr = typeof itemObj === 'object' ? itemObj.tanggal : '-';

  const template = `🚨 LAPORAN PENIPUAN 🚨\n\nNomor/UID: ${nomorStr}\nPlatform/Bank: ${metaStr}\nTanggal Terdata: ${tanggalStr}\n\nHati-hati terhadap modus penipuan dengan informasi di atas!`;
  copyToClipboard(template, 'Template laporan disalin!');
}

function filterData() {
  try {
    const rawQuery = document.getElementById('searchInput').value.trim().toLowerCase();
    const cleanQuery = rawQuery.replace(/[^a-zA-Z0-9]/g, '');

    updateUrlParam(rawQuery);

    const resultList = document.getElementById('resultList');
    const counter = document.getElementById('dataCounter');
    resultList.innerHTML = "";

    const currentData = database[activeTab] || [];
    
    const filtered = currentData.filter(item => {
      if (rawQuery === '') return true;

      const nomorStr = typeof item === 'object' ? String(item.nomor) : String(item);
      const tanggalStr = typeof item === 'object' ? String(item.tanggal || '').toLowerCase() : '';
      const metaStr = typeof item === 'object' ? String(item.meta || item.bank || item.game || '').toLowerCase() : '';

      return nomorStr.toLowerCase().includes(rawQuery) || 
             (cleanQuery !== '' && nomorStr.includes(cleanQuery)) ||
             tanggalStr.includes(rawQuery) ||
             metaStr.includes(rawQuery);
    });

    counter.innerText = `${filtered.length} Data`;

    if (filtered.length === 0) {
      resultList.innerHTML = '<li class="empty-msg">Tidak ada data ditemukan.</li>';
      return;
    }

    const visibleData = filtered.slice(0, renderLimit);
    const fragment = document.createDocumentFragment();

    visibleData.forEach(item => {
      const nomorStr = typeof item === 'object' ? String(item.nomor) : String(item);
      const tanggalStr = typeof item === 'object' ? String(item.tanggal || '-') : '-';
      const metaStr = typeof item === 'object' ? String(item.meta || item.bank || item.game || '-') : '-';

      const li = document.createElement('li');
      li.className = 'result-item';
      li.dataset.nomor = nomorStr;
      li.title = "Klik untuk menyalin nomor";

      let dateHtml = '';
      if (tanggalStr !== '-' && tanggalStr.length > 0) {
        const dParts = tanggalStr.includes('-') ? tanggalStr.split('-') : [tanggalStr];
        const formattedDate = dParts.length === 3 ? `${dParts[2]}/${dParts[1]}/${dParts[0]}` : tanggalStr;
        dateHtml = `<span class="badge-date">${formattedDate}</span>`;
      }

      let metaHtml = '';
      if (metaStr && metaStr !== '-') {
        metaHtml = `<span class="badge-meta">${metaStr}</span>`;
      }

      const deleteBtnHtml = isAdmin ? `<button class="btn btn-delete">Hapus</button>` : '';

      li.innerHTML = `
        <span class="number">${nomorStr}</span>
        <div class="right-content">
          ${metaHtml}
          ${dateHtml}
          <button class="btn-icon" title="Salin Template Laporan" aria-label="Salin Template Laporan">📢</button>
          ${deleteBtnHtml}
        </div>
      `;
      fragment.appendChild(li);
    });

    if (filtered.length > renderLimit) {
      const loadMoreLi = document.createElement('li');
      loadMoreLi.className = 'load-more-container';
      loadMoreLi.innerHTML = `<button class="btn btn-load-more">Muat Lebih Banyak</button>`;
      fragment.appendChild(loadMoreLi);
    }

    resultList.appendChild(fragment);

  } catch (error) {
    console.error("Terjadi masalah saat merender list:", error);
    document.getElementById('resultList').innerHTML = '<li class="empty-msg" style="color:#e11d48;">Terjadi kendala saat membaca data. Coba muat ulang halaman.</li>';
  }
}

document.getElementById('searchInput').addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    renderLimit = 50;
    filterData();
  }, 300);
});

document.addEventListener('keydown', (e) => {
  const searchInput = document.getElementById('searchInput');
  if (e.key === '/' && document.activeElement !== searchInput && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
    e.preventDefault();
    searchInput.focus();
  }
});

function copyToClipboard(text, toastMessage = 'Berhasil disalin!') {
  navigator.clipboard.writeText(text).then(() => {
    showToast(toastMessage);
  }).catch(err => {
    console.error('Gagal menyalin:', err);
    alert('Gagal menyalin ke clipboard.');
  });
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, 3000);
}

function openQrisModal(src) {
  document.getElementById('modalImg').src = src;
  document.getElementById('qrisModal').style.display = 'flex';
}

function closeQrisModal() {
  document.getElementById('qrisModal').style.display = 'none';
}

fetchOnlineDatabase();

</script>
