<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Database UID HB & Scammer</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      
      /* Mode Terang */
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(255, 255, 255, 0.9);
      --card-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
      
      --text-main: #334155;
      --text-muted: #64748b;
      --text-title: #0f172a;
      
      --tab-bg: #f1f5f9;
      --tab-active-bg: #ffffff;
      --tab-active-text: #4f46e5;
      --tab-active-shadow: 0 4px 12px rgba(79, 70, 229, 0.12);
      
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-focus: #6366f1;
      
      --item-bg: #ffffff;
      --item-border: #fecdd3;
      --item-badge: #e11d48;
      --item-badge-bg: #fff1f2;
      
      --date-badge: #64748b;
      --date-badge-bg: #f1f5f9;
      
      --btn-primary: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      --btn-admin: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      --btn-add: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --btn-delete: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      
      --donate-bg: rgba(254, 243, 199, 0.6);
      --donate-border: rgba(252, 211, 77, 0.7);
      --scrollbar-thumb: #cbd5e1;
    }

    body.dark-mode {
      /* Mode Gelap */
      --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 100%);
      --card-bg: rgba(17, 24, 39, 0.82);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      
      --text-main: #cbd5e1;
      --text-muted: #94a3b8;
      --text-title: #f8fafc;
      
      --tab-bg: rgba(15, 23, 42, 0.6);
      --tab-active-bg: #1e293b;
      --tab-active-text: #818cf8;
      --tab-active-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
      
      --input-bg: rgba(15, 23, 42, 0.65);
      --input-border: #334155;
      --input-focus: #818cf8;
      
      --item-bg: #1e293b;
      --item-border: #881337;
      --item-badge: #fda4af;
      --item-badge-bg: rgba(225, 29, 72, 0.18);
      
      --date-badge: #cbd5e1;
      --date-badge-bg: rgba(15, 23, 42, 0.5);
      
      --btn-primary: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --btn-admin: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      --btn-add: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --btn-delete: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      
      --donate-bg: rgba(120, 53, 15, 0.2);
      --donate-border: rgba(180, 83, 9, 0.3);
      --scrollbar-thumb: #334155;
    }

    * {
      box-sizing: border-box;
      font-family: var(--font-family);
      margin: 0;
      padding: 0;
    }

    body, .container, .tab-btn, .btn, .result-item, input, textarea {
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      background: var(--bg-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      height: 92dvh;
      max-height: 850px;
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
    }

    @media (min-width: 640px) {
      body {
        padding: 24px;
      }
      .container {
        max-width: 540px;
        height: 88dvh;
        border-radius: 24px;
        padding: 24px;
      }
    }

    /* Header Minimalis & Profesional */
    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(156, 163, 175, 0.12);
      flex-shrink: 0;
    }

    h2 {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-title);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    h2:hover {
      opacity: 0.75;
    }

    .btn-theme {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--input-border);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
    }

    .btn-theme:hover {
      background: var(--input-border);
      color: var(--text-title);
    }

    .status-bar-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .status-bar {
      font-size: 0.725rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--input-bg);
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--input-border);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .data-counter {
      font-size: 0.725rem;
      font-weight: 600;
      color: var(--text-title);
      background: var(--input-bg);
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid var(--input-border);
      white-space: nowrap;
    }

    /* Running Text Seamless Loop (Tanpa Jeda) */
    .last-updated-wrapper {
      width: 100%;
      overflow: hidden;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 8px 16px;
      flex-shrink: 0;
      display: flex;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
      position: relative;
      mask-image: linear-gradient(to right, transparent, black 3%, black 97%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 3%, black 97%, transparent);
    }

    .marquee-track {
      display: inline-block;
      white-space: nowrap;
      animation: scrollLoop 25s linear infinite;
    }

    .last-updated-wrapper:hover .marquee-track {
      animation-play-state: paused;
    }

    .marquee-content {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-main);
      padding-right: 50px; /* Jarak pisah antar putaran */
    }

    @keyframes scrollLoop {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .tabs {
      display: flex;
      background: var(--tab-bg);
      padding: 4px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: transparent;
      border: none;
      font-size: 0.825rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      border-radius: 8px;
    }

    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      box-shadow: var(--tab-active-shadow);
    }

    .search-box, .admin-panel {
      flex-shrink: 0;
    }

    .search-box input, .admin-box input, .admin-box textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.825rem;
      background: var(--input-bg);
      color: var(--text-title);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      outline: none;
    }

    /* Mode Pemilik yang Lebih Ringkas & Efisien */
    .admin-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .admin-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--input-bg);
      border: 1px dashed var(--input-focus);
      padding: 8px 10px;
      border-radius: 12px;
    }

    .admin-box textarea {
      resize: none;
      height: 38px;
      min-height: 38px;
      padding: 6px 10px;
      font-size: 0.78rem;
    }

    .admin-inputs {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .admin-inputs input {
      padding: 7px 10px;
      font-size: 0.78rem;
    }

    .search-box input:focus, .admin-box input:focus, .admin-box textarea:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-admin { background: var(--btn-admin); width: 100%; padding: 8px 16px; }
    .btn-add { background: var(--btn-add); width: 100%; padding: 8px 16px; }
    .btn-delete { background: var(--btn-delete); padding: 5px 8px; font-size: 0.7rem; border-radius: 6px; }
    
    .btn-load-more {
      background: var(--btn-admin);
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.8rem;
    }

    .result-list {
      list-style: none;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
      scroll-behavior: smooth;
    }

    .result-list::-webkit-scrollbar {
      width: 5px;
    }
    .result-list::-webkit-scrollbar-thumb {
      background-color: var(--scrollbar-thumb);
      border-radius: 10px;
    }

    .result-item {
      background: var(--item-bg);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--item-border);
      padding: 12px 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      flex-shrink: 0;
      cursor: pointer;
    }

    .result-item .number {
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      word-break: break-all;
      color: var(--text-title);
    }

    .right-content {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      background: var(--item-badge-bg);
      color: var(--item-badge);
      border: 1px solid var(--item-border);
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .badge-date {
      background: var(--date-badge-bg);
      color: var(--date-badge);
      border: 1px solid var(--input-border);
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
      white-space: nowrap;
    }

    .btn-icon {
      font-size: 0.75rem;
      background: transparent;
      border: none;
      cursor: pointer;
      opacity: 0.6;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .btn-icon:hover {
      opacity: 1;
      background: rgba(0, 0, 0, 0.05);
    }

    .empty-msg, .load-more-container {
      text-align: center;
      color: var(--text-muted);
      padding: 12px;
      font-size: 0.85rem;
      list-style: none;
    }

    .donation-section {
      background: var(--donate-bg);
      border: 1px solid var(--donate-border);
      border-radius: 14px;
      padding: 12px 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .donation-title { font-weight: 700; font-size: 0.8rem; color: var(--text-title); }
    .donation-desc { font-size: 0.7rem; color: var(--text-muted); }
    .donation-action { display: flex; align-items: center; gap: 10px; }
    
    .qris-img {
      width: 36px; height: 36px; object-fit: cover;
      border-radius: 8px; border: 1px solid var(--card-border); cursor: pointer;
    }
    .btn-donate-link {
      background: #f59e0b; color: #ffffff; padding: 6px 12px;
      font-size: 0.75rem; font-weight: 600; text-decoration: none;
      border-radius: 10px; white-space: nowrap;
    }

    .qris-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 1000;
    }
    .qris-modal img {
      max-width: 85%; max-height: 75%; border-radius: 16px; background: #ffffff;
      padding: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.95); color: #ffffff; padding: 8px 18px; border-radius: 20px;
      font-size: 0.75rem; font-weight: 500; opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; z-index: 2000;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-area">
    <h2 onclick="resetToHome()" title="Kembali ke Halaman Utama">🛡️ UID HB & REK SCAMMER</h2>
    <button id="themeToggleBtn" class="btn-theme" onclick="toggleTheme()">Dark</button>
  </div>
  
  <div class="status-bar-container">
    <div id="statusBar" class="status-bar">Memuat data online...</div>
    <div id="dataCounter" class="data-counter">0 Data</div>
  </div>

  <!-- Running Text Seamless Loop (Tanpa Jeda) -->
  <div id="runningTextWrapper" class="last-updated-wrapper">
    <div class="marquee-track">
      <div id="lastUpdated1" class="marquee-content">Diperbarui: -</div>
      <div id="lastUpdated2" class="marquee-content">Diperbarui: -</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabRekening" onclick="switchTab('rekening')">Rekening Scammer</button>
    <button class="tab-btn" id="tabGenshin" onclick="switchTab('genshin')">UID HB Genshin</button>
  </div>

  <div class="admin-panel">
    <button id="authBtn" class="btn btn-admin" onclick="toggleAdmin()">🔑 Mode Pemilik</button>
    
    <div id="addBox" class="admin-box" style="display: none;">
      <textarea id="infoTambahanInput" placeholder="Info tambahan / pengumuman singkat..."></textarea>
      <div class="admin-inputs">
        <input type="text" id="newNumberInput" style="flex: 1.5;" placeholder="Nomor/UID baru..." onkeydown="handleInputKeyDown(event)">
        <input type="date" id="newDateInput" style="flex: 1;" title="Tanggal Dilaporkan">
      </div>
      <button class="btn btn-add" id="btnAdd" onclick="addNumber()">+ Simpan Data</button>
    </div>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" aria-label="Cari Rekening atau UID" placeholder="Cari Rekening/ E-Wallet Scammer... (Tekan '/' untuk fokus)">
  </div>

  <ul class="result-list" id="resultList"></ul>

  <div class="donation-section">
    <div class="donation-text">
      <span class="donation-title">☕ Dukung Capllang</span>
      <span class="donation-desc">Kopi pahit terasa manis hari ini</span>
    </div>
    <div class="donation-action">
      <img src="https://www.image2url.com/r2/default/images/1786971411556-c9bfbe24-e071-424f-b555-dc1d949db21d.jpg" alt="Scan QRIS" class="qris-img" onclick="openQrisModal(this.src)" title="Perbesar QRIS">
      <a href="https://saweria.co/capllang/" target="_blank" rel="noopener noreferrer" class="btn-donate-link">Saweria</a>
    </div>
  </div>
</div>

<div id="qrisModal" class="qris-modal" onclick="closeQrisModal()">
  <img id="modalImg" src="" alt="QRIS Preview" onclick="event.stopPropagation()">
</div>

<div id="toast" class="toast">Berhasil disalin!</div>

<script>
const PROXY_URL = "https://jsonbin-proxy.awak-cot-u-sibak.workers.dev";

let adminSecretKey = null;
let database = { rekening: [], genshin: [], lastUpdated: null, infoTambahan: "" };
let isAdmin = false;
let activeTab = 'rekening';
let searchTimeout = null;
let renderLimit = 50;

function formatLastUpdated(timestamp, infoTambahan) {
  if (!timestamp) return "Diperbarui: -";
  const date = new Date(timestamp);
  const timeStr = isNaN(date.getTime()) ? timestamp : `${date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })} pukul ${date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })} WIB`;
  
  let resultText = `🕒 Terakhir Update: ${timeStr}`;
  if (infoTambahan && infoTambahan.trim() !== "") {
    resultText += `  |  📢 Info: ${infoTambahan.trim()}`;
  }
  return resultText;
}

function updateLastUpdatedUI() {
  const baseText = database.lastUpdated ? formatLastUpdated(database.lastUpdated, database.infoTambahan) : "Diperbarui: -";
  document.getElementById('lastUpdated1').textContent = baseText;
  document.getElementById('lastUpdated2').textContent = baseText;
}

function migrateData(dataArray) {
  return dataArray.map(item => {
    if (typeof item === 'string') {
      return { nomor: item, tanggal: "-" };
    }
    return item;
  });
}

function resetToHome() {
  window.history.replaceState({}, '', window.location.pathname);
  document.getElementById('searchInput').value = '';
  switchTab('rekening');
  const resultList = document.getElementById('resultList');
  if(resultList) resultList.scrollTop = 0;
  showToast("Kembali ke Halaman Utama");
}

async function fetchOnlineDatabase() {
  const status = document.getElementById('statusBar');
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 5000);

  try {
    status.innerText = "⏳ Memperbarui server...";
    const res = await fetch(PROXY_URL, { signal: controller.signal });
    clearTimeout(timeoutId);

    if (!res.ok) throw new Error("Gagal terhubung ke Worker");
    
    const data = await res.json();
    if (data.record && Array.isArray(data.record.rekening) && Array.isArray(data.record.genshin)) {
      database = data.record;
      database.rekening = migrateData(database.rekening);
      database.genshin = migrateData(database.genshin);
      if (database.infoTambahan === undefined) database.infoTambahan = "";
      
      localStorage.setItem('cached_scammer_db', JSON.stringify(database));
      status.innerText = "🟢 Koneksi aman: Database optimal.";
    } else {
      throw new Error("Format data tidak sesuai");
    }
  } catch (err) {
    console.warn("Menggunakan cache lokal:", err);
    const cached = localStorage.getItem('cached_scammer_db');
    if (cached) {
      try { 
        database = JSON.parse(cached); 
        database.rekening = migrateData(database.rekening || []);
        database.genshin = migrateData(database.genshin || []);
        if (database.infoTambahan === undefined) database.infoTambahan = "";
      } catch(e) { 
        database = { rekening: [], genshin: [], lastUpdated: null, infoTambahan: "" }; 
      }
    }
    status.innerText = "🔴 Mode Offline (Data Lokal)";
  }
  
  updateLastUpdatedUI();
  checkUrlParams();
  filterData();
}

async function saveOnlineDatabase() {
  const status = document.getElementById('statusBar');
  status.innerText = "⏳ Menyimpan data...";
  
  if (!adminSecretKey) {
    alert("Sesi Admin telah berakhir. Silakan login kembali.");
    exitAdminMode();
    return false;
  }

  database.lastUpdated = new Date().toISOString();

  try {
    const cleanSecret = String(adminSecretKey).trim();
    const res = await fetch(PROXY_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Admin-Secret': cleanSecret
      },
      body: JSON.stringify(database)
    });
    
    if (res.status === 401 || res.status === 403) {
      alert("🔒 Password Admin Salah atau Sesi Ditolak!");
      exitAdminMode();
      status.innerText = "⚠️ Autentikasi Gagal";
      return false;
    }

    if (!res.ok) throw new Error("Gagal menyimpan data ke server");
    
    localStorage.setItem('cached_scammer_db', JSON.stringify(database));
    status.innerText = "🟢 Tersimpan di server!";
    updateLastUpdatedUI();
    return true;
  } catch (err) {
    alert("⚠️ Gagal memperbarui server: Akses ditolak atau masalah jaringan.");
    status.innerText = "⚠️ Simpan gagal";
    return false;
  }
}

function exitAdminMode() {
  isAdmin = false;
  adminSecretKey = null;
  document.getElementById('authBtn').innerText = "🔑 Mode Pemilik";
  document.getElementById('addBox').style.display = "none";
  document.getElementById('runningTextWrapper').style.display = "flex";
  filterData();
}

function toggleAdmin() {
  if (!isAdmin) {
    const inputSecret = prompt("Masukkan Password Admin:");
    if (inputSecret && inputSecret.trim() !== "") {
      adminSecretKey = inputSecret.trim();
      isAdmin = true;
      document.getElementById('authBtn').innerText = "🔓 Keluar Mode Pemilik";
      document.getElementById('addBox').style.display = "flex";
      document.getElementById('runningTextWrapper').style.display = "none";
      document.getElementById('newDateInput').valueAsDate = new Date();
      document.getElementById('infoTambahanInput').value = database.infoTambahan || "";
      showToast("Mode Pemilik Aktif");
    } else if (inputSecret !== null) {
      alert("Password Admin wajib diisi!");
    }
  } else {
    exitAdminMode();
    showToast("Keluar Mode Pemilik");
  }
}

function handleInputKeyDown(e) {
  if (e.key === 'Enter') addNumber();
}

async function addNumber() {
  const input = document.getElementById('newNumberInput');
  const dateInput = document.getElementById('newDateInput');
  const infoInput = document.getElementById('infoTambahanInput');
  const btnAdd = document.getElementById('btnAdd');
  
  const rawVal = input.value.trim();
  const dateVal = dateInput.value;
  const infoVal = infoInput.value.trim();

  database.infoTambahan = infoVal;

  if (!rawVal) {
    if (!infoVal) {
      alert("⚠️ Masukkan nomor/UID baru atau isi info tambahan!");
      return;
    }
    btnAdd.disabled = true;
    btnAdd.innerText = "⏳ Menyimpan Info...";
    
    const success = await saveOnlineDatabase();
    if (success) {
      showToast("Info tambahan berhasil diperbarui!");
    }
    btnAdd.disabled = false;
    btnAdd.innerText = "+ Simpan Data";
    return;
  }

  if (!dateVal) {
    alert("⚠️ Tanggal wajib diisi jika menambahkan nomor!");
    return;
  }

  const cleanVal = rawVal.replace(/\D/g, '');

  if (activeTab === 'genshin') {
    if (!/^\d{9,10}$/.test(cleanVal)) {
      alert("⚠️ UID Genshin Impact tidak valid!\nUID harus berupa angka dengan panjang 9 atau 10 digit.");
      return;
    }
  } else if (activeTab === 'rekening') {
    if (!/^\d{5,25}$/.test(cleanVal)) {
      alert("⚠️ Nomor Rekening/E-Wallet tidak valid!\nHarus berupa angka dengan panjang minimal 5 digit.");
      return;
    }
  }

  const exists = database[activeTab].some(item => {
    const num = typeof item === 'object' ? item.nomor : item;
    return num === cleanVal;
  });

  if (exists) {
    alert("⚠️ Nomor/UID ini sudah ada di dalam database!");
    return;
  }

  btnAdd.disabled = true;
  btnAdd.innerText = "⏳ Menyimpan...";
  
  const newItem = { nomor: cleanVal, tanggal: dateVal };
  database[activeTab].unshift(newItem);
  
  const success = await saveOnlineDatabase();
  if (success) {
    input.value = "";
    document.getElementById('searchInput').value = "";
    renderLimit = 50;
    filterData();
    showToast("Data & info berhasil ditambahkan!");
  } else {
    database[activeTab].shift();
  }
  
  btnAdd.disabled = false;
  btnAdd.innerText = "+ Simpan Data";
}

async function deleteNumber(itemObj, btnEl) {
  const nomorStr = typeof itemObj === 'object' ? itemObj.nomor : itemObj;
  
  if (confirm(`Hapus ${nomorStr} dari database?`)) {
    const index = database[activeTab].indexOf(itemObj);
    if (index > -1) {
      if (btnEl) btnEl.disabled = true;
      
      const originalData = [...database[activeTab]];
      database[activeTab].splice(index, 1);
      
      const success = await saveOnlineDatabase();
      if (success) {
        filterData();
        showToast("Data dihapus!");
      } else {
        database[activeTab] = originalData;
        if (btnEl) btnEl.disabled = false;
      }
    }
  }
}

function switchTab(tab) {
  activeTab = tab;
  renderLimit = 50;
  document.getElementById('tabRekening').classList.toggle('active', tab === 'rekening');
  document.getElementById('tabGenshin').classList.toggle('active', tab === 'genshin');

  const input = document.getElementById('searchInput');
  input.placeholder = tab === 'rekening' 
    ? "Cari Rekening/ E-Wallet..." 
    : "Cari UID HB Genshin Impact...";

  filterData();
}

function checkUrlParams() {
  const urlParams = new URLSearchParams(window.location.search);
  const searchQuery = urlParams.get('search') || urlParams.get('q');
  const tabQuery = urlParams.get('tab');

  if (tabQuery && (tabQuery === 'rekening' || tabQuery === 'genshin')) {
    activeTab = tabQuery;
    document.getElementById('tabRekening').classList.toggle('active', activeTab === 'rekening');
    document.getElementById('tabGenshin').classList.toggle('active', activeTab === 'genshin');
  }
  if (searchQuery) {
    document.getElementById('searchInput').value = searchQuery;
  }
}

function updateUrlParam(query) {
  const url = new URL(window.location.href);
  if (query) {
    url.searchParams.set('search', query);
  } else {
    url.searchParams.delete('search');
  }
  window.history.replaceState({}, '', url.toString());
}

function copyReportTemplate(nomor) {
  const categoryLabel = activeTab === 'rekening' ? 'Rekening Scammer' : 'UID HB Genshin Impact';
  const currentUrl = `${window.location.origin}${window.location.pathname}?search=${encodeURIComponent(nomor)}&tab=${activeTab}`;
  
  const template = `⚠️ LAPORAN SCAMMER / UID HB ⚠️\n\nKategori : ${categoryLabel}\nNomor/UID: ${nomor}\nStatus   : WASPADA / TERINDIKASI PENIPUAN\n\nCek data selengkapnya di:\n${currentUrl}`;

  copyToClipboard(template, "Template Laporan disalin!");
}

function filterData() {
  const rawQuery = document.getElementById('searchInput').value.trim().toLowerCase();
  const cleanQuery = rawQuery.replace(/[^a-zA-Z0-9]/g, '');

  updateUrlParam(rawQuery);

  const resultList = document.getElementById('resultList');
  const counter = document.getElementById('dataCounter');
  resultList.innerHTML = "";

  const currentData = database[activeTab] || [];
  
  const filtered = currentData.filter(item => {
    const nomorStr = typeof item === 'object' ? item.nomor : item;
    const rawNomor = nomorStr.toLowerCase();
    const cleanNomor = rawNomor.replace(/[^a-zA-Z0-9]/g, '');
    return rawNomor.includes(rawQuery) || (cleanQuery !== '' && cleanNomor.includes(cleanQuery));
  });

  counter.innerText = `${filtered.length} Data`;

  if (filtered.length === 0) {
    const emptyLi = document.createElement('li');
    emptyLi.className = 'empty-msg';
    emptyLi.textContent = 'Tidak ada data ditemukan.';
    resultList.appendChild(emptyLi);
    return;
  }

  const visibleData = filtered.slice(0, renderLimit);
  const fragment = document.createDocumentFragment();

  visibleData.forEach(item => {
    const nomorStr = typeof item === 'object' ? item.nomor : item;
    const tanggalStr = typeof item === 'object' ? item.tanggal : '-';

    const li = document.createElement('li');
    li.className = 'result-item';
    li.title = "Klik untuk menyalin nomor";
    li.addEventListener('click', () => copyToClipboard(nomorStr, `Disalin: ${nomorStr}`));

    const spanNumber = document.createElement('span');
    spanNumber.className = 'number';
    spanNumber.textContent = nomorStr;

    const rightContent = document.createElement('div');
    rightContent.className = 'right-content';
    
    if (tanggalStr && tanggalStr !== '-') {
      const dateBadge = document.createElement('span');
      dateBadge.className = 'badge-date';
      const dParts = tanggalStr.split('-');
      if (dParts.length === 3) {
        dateBadge.textContent = `${dParts[2]}/${dParts[1]}/${dParts[0]}`;
      } else {
        dateBadge.textContent = tanggalStr;
      }
      rightContent.appendChild(dateBadge);
    }

    const badgeSpan = document.createElement('span');
    badgeSpan.className = 'badge';
    badgeSpan.textContent = 'Waspada';

    const reportBtn = document.createElement('button');
    reportBtn.className = 'btn-icon';
    reportBtn.title = 'Salin Template Laporan';
    reportBtn.setAttribute('aria-label', 'Salin Template Laporan');
    reportBtn.textContent = '📢';
    reportBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      copyReportTemplate(nomorStr);
    });

    rightContent.appendChild(badgeSpan);
    rightContent.appendChild(reportBtn);

    if (isAdmin) {
      const btnDelete = document.createElement('button');
      btnDelete.className = 'btn btn-delete';
      btnDelete.textContent = 'Hapus';
      btnDelete.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteNumber(item, btnDelete);
      });
      rightContent.appendChild(btnDelete);
    }

    li.appendChild(spanNumber);
    li.appendChild(rightContent);
    fragment.appendChild(li);
  });

  if (filtered.length > renderLimit) {
    const loadMoreLi = document.createElement('li');
    loadMoreLi.className = 'load-more-container';
    const loadMoreBtn = document.createElement('button');
    loadMoreBtn.className = 'btn btn-load-more';
    loadMoreBtn.textContent = `Tampilkan ${filtered.length - renderLimit} Data Lagi...`;
    loadMoreBtn.addEventListener('click', () => {
      renderLimit += 50;
      filterData();
    });
    loadMoreLi.appendChild(loadMoreBtn);
    fragment.appendChild(loadMoreLi);
  }

  resultList.appendChild(fragment);
}

function copyToClipboard(text, customMessage) {
  const message = customMessage || `Disalin: ${text}`;
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => {
      showToast(message);
    }).catch(() => fallbackCopyTextToClipboard(text, message));
  } else {
    fallbackCopyTextToClipboard(text, message);
  }
}

function fallbackCopyTextToClipboard(text, customMessage) {
  const textArea = document.createElement("textarea");
  textArea.value = text;
  document.body.appendChild(textArea);
  textArea.select();
  try {
    document.execCommand('copy');
    showToast(customMessage || `Disalin: ${text}`);
  } catch (err) {
    showToast("Gagal menyalin teks.");
  }
  document.body.removeChild(textArea);
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

function initTheme() {
  const savedTheme = localStorage.getItem('theme_preference');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
    document.getElementById('themeToggleBtn').innerHTML = "Light";
  }
}

function toggleTheme() {
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  document.getElementById('themeToggleBtn').innerHTML = isDark ? "Light" : "Dark";
  localStorage.setItem('theme_preference', isDark ? 'dark' : 'light');
}

function openQrisModal(src) {
  document.getElementById('modalImg').src = src;
  document.getElementById('qrisModal').style.display = 'flex';
}

function closeQrisModal() {
  document.getElementById('qrisModal').style.display = 'none';
}

// Event Listeners Awal
document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  fetchOnlineDatabase();

  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      renderLimit = 50;
      filterData();
    }, 150);
  });

  // Shortcut '/' untuk fokus pencarian
  window.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== searchInput && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
      e.preventDefault();
      searchInput.focus();
    }
  });
});
</script>
