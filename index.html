<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Database UID HB & Scammer</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      --outer-bg: #1e293b;
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(255, 255, 255, 0.9);
      --card-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);

      --text-main: #334155;
      --text-muted: #64748b;
      --text-title: #0f172a;

      --tab-bg: #f1f5f9;
      --tab-active-bg: #ffffff;
      --tab-active-text: #4f46e5;
      --tab-active-shadow: 0 4px 12px rgba(79, 70, 229, 0.12);

      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-focus: #6366f1;

      --item-bg: #ffffff;
      --item-border: #fecdd3;

      --date-badge: #64748b;
      --date-badge-bg: #f1f5f9;

      --meta-badge: #4338ca;
      --meta-badge-bg: #eef2ff;
      --meta-badge-border: #c7d2fe;

      --btn-primary: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      --btn-admin: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      --btn-add: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --btn-delete: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);

      --donate-bg: rgba(254, 243, 199, 0.6);
      --donate-border: rgba(252, 211, 77, 0.7);
      --scrollbar-thumb: #cbd5e1;
    }

    body.dark-mode {
      --outer-bg: #e2e8f0;
      --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 100%);
      --card-bg: rgba(17, 24, 39, 0.82);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);

      --text-main: #cbd5e1;
      --text-muted: #94a3b8;
      --text-title: #f8fafc;

      --tab-bg: rgba(15, 23, 42, 0.6);
      --tab-active-bg: #1e293b;
      --tab-active-text: #818cf8;
      --tab-active-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);

      --input-bg: rgba(15, 23, 42, 0.65);
      --input-border: #334155;
      --input-focus: #818cf8;

      --item-bg: #1e293b;
      --item-border: #881337;

      --date-badge: #cbd5e1;
      --date-badge-bg: rgba(15, 23, 42, 0.5);

      --meta-badge: #a5b4fc;
      --meta-badge-bg: rgba(99, 102, 241, 0.18);
      --meta-badge-border: #4338ca;

      --btn-primary: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --btn-admin: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      --btn-add: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --btn-delete: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);

      --donate-bg: rgba(120, 53, 15, 0.2);
      --donate-border: rgba(180, 83, 9, 0.3);
      --scrollbar-thumb: #334155;
    }

    * {
      box-sizing: border-box;
      font-family: var(--font-family);
      margin: 0;
      padding: 0;
    }

    body, .container, .tab-btn, .btn, .result-item, input, select {
      transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      background: var(--outer-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      height: 92dvh;
      max-height: 850px;
      background: var(--bg-gradient);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
    }

    @media (min-width: 640px) {
      body {
        padding: 24px;
      }

      .container {
        max-width: 540px;
        height: 88dvh;
        border-radius: 24px;
        padding: 24px;
      }
    }

    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(156, 163, 175, 0.12);
      flex-shrink: 0;
    }

    h2 {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-title);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    h2:hover {
      opacity: 0.75;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-theme,
    .btn-header-admin {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--input-border);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-theme:hover,
    .btn-header-admin:hover {
      background: var(--input-border);
      color: var(--text-title);
    }

    .status-bar-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .status-bar {
      font-size: 0.725rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--input-bg);
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--input-border);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .data-counter {
      font-size: 0.725rem;
      font-weight: 600;
      color: var(--text-title);
      background: var(--input-bg);
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid var(--input-border);
      white-space: nowrap;
    }

    .tabs {
      display: flex;
      background: var(--tab-bg);
      padding: 4px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: transparent;
      border: none;
      font-size: 0.825rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      border-radius: 8px;
    }

    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      box-shadow: var(--tab-active-shadow);
    }

    .search-box,
    .admin-panel {
      flex-shrink: 0;
    }

    .search-box input,
    .admin-box input,
    .admin-box select {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.825rem;
      background: var(--input-bg);
      color: var(--text-title);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      outline: none;
    }

    .admin-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .admin-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--input-bg);
      border: 1px dashed var(--input-focus);
      padding: 8px 10px;
      border-radius: 12px;
    }

    .admin-inputs {
      display: flex;
      gap: 6px;
      width: 100%;
      flex-wrap: wrap;
    }

    .admin-inputs input,
    .admin-inputs select {
      padding: 7px 10px;
      font-size: 0.78rem;
    }

    .search-box input:focus,
    .admin-box input:focus,
    .admin-box select:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-add {
      background: var(--btn-add);
      width: 100%;
      padding: 8px 16px;
    }

    .btn-delete {
      background: var(--btn-delete);
      padding: 5px 8px;
      font-size: 0.7rem;
      border-radius: 6px;
    }

    .btn-load-more {
      background: var(--btn-admin);
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.8rem;
    }

    .result-list {
      list-style: none;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
      scroll-behavior: smooth;
    }

    .result-list::-webkit-scrollbar {
      width: 5px;
    }

    .result-list::-webkit-scrollbar-thumb {
      background-color: var(--scrollbar-thumb);
      border-radius: 10px;
    }

    .result-item {
      background: var(--item-bg);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--item-border);
      padding: 12px 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      flex-shrink: 0;
      cursor: pointer;
    }

    .result-item .number {
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      word-break: break-all;
      color: var(--text-title);
    }

    .right-content {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge-date {
      background: var(--date-badge-bg);
      color: var(--date-badge);
      border: 1px solid var(--input-border);
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-meta {
      background: var(--meta-badge-bg);
      color: var(--meta-badge);
      border: 1px solid var(--meta-badge-border);
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 700;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--input-border);
      border-radius: 6px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .btn-icon:hover {
      background: var(--input-border);
      color: var(--text-title);
    }

    .empty-msg,
    .load-more-container {
      text-align: center;
      color: var(--text-muted);
      padding: 12px;
      font-size: 0.85rem;
      list-style: none;
    }

    .donation-section {
      background: var(--donate-bg);
      border: 1px solid var(--donate-border);
      border-radius: 14px;
      padding: 12px 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .donation-title {
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--text-title);
    }

    .donation-action {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qris-img {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      cursor: pointer;
    }

    .btn-donate-link {
      background: #f59e0b;
      color: #ffffff;
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
      white-space: nowrap;
    }

    .qris-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .qris-modal img {
      max-width: 85%;
      max-height: 75%;
      border-radius: 16px;
      background: #ffffff;
      padding: 12px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }

    .admin-modal-content,
    .confirm-modal-content {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      padding: 20px;
      border-radius: 16px;
      width: 90%;
      max-width: 320px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }

    .confirm-modal-content {
      max-width: 340px;
    }

    .confirm-title {
      color: var(--text-title);
      font-size: 0.95rem;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .confirm-message {
      color: var(--text-muted);
      font-size: 0.78rem;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .confirm-actions {
      display: flex;
      gap: 8px;
    }

    .confirm-actions button {
      flex: 1;
    }

    .btn-confirm-cancel {
      background: var(--input-border);
      color: var(--text-main);
    }

    .btn-confirm-danger {
      background: var(--btn-delete);
    }

    .loading-indicator {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      color: var(--text-muted);
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .loading-indicator.show {
      display: flex;
    }

    .loading-spinner {
      width: 15px;
      height: 15px;
      border: 2px solid var(--input-border);
      border-top-color: var(--input-focus);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      z-index: 2000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header-area">
    <h2 onclick="resetToHome()" title="Kembali ke Halaman Utama">
      🛡️ UID HB & REK SCAMMER
    </h2>

    <div class="header-actions">
      <button id="authBtn" class="btn-header-admin" onclick="toggleAdmin()">
        🔑 Mode Pemilik
      </button>

      <button id="themeToggleBtn" class="btn-theme" onclick="toggleTheme()">
        Dark
      </button>
    </div>
  </div>

  <div class="status-bar-container">
    <div id="statusBar" class="status-bar">
      Memuat data online...
    </div>

    <div id="dataCounter" class="data-counter">
      0 Data
    </div>
  </div>

  <div class="tabs">
    <button
      class="tab-btn active"
      id="tabRekening"
      onclick="switchTab('rekening')">
      LIST REK SCAMMER
    </button>

    <button
      class="tab-btn"
      id="tabGenshin"
      onclick="switchTab('genshin')">
      LIST UID HB
    </button>
  </div>

  <div class="admin-panel">
    <div id="addBox" class="admin-box" style="display: none;">

      <div class="admin-inputs">

        <select
          id="metaSelectInput"
          style="flex: 1.2;"
          onchange="handleMetaSelectChange(this)">
        </select>

        <input
          type="text"
          id="metaCustomInput"
          style="flex: 1; display: none;"
          placeholder="Nama Bank/Game Lain...">

        <input
          type="text"
          id="newNumberInput"
          style="flex: 1.5;"
          placeholder="Nomor/UID baru..."
          onkeydown="handleInputKeyDown(event)">

        <input
          type="date"
          id="newDateInput"
          style="flex: 1;"
          title="Tanggal Dilaporkan">

      </div>

      <button

  <div class="search-box">

  </div>

  <div id="loadingIndicator" class="loading-indicator">

    <span id="loadingText">Memuat...</span>
  </div>

  <ul class="result-list" id="resultList"></ul>

  <div class="donation-section">
    <div class="donation-text">
      <span class="donation-title">
        ☕ Sawer Capllang
      </span>
    </div>

    <div class="donation-action">

      <img
        src="https://www.image2url.com/r2/default/images/1786971411556-c9bfbe24-e071-424f-b555-dc1d949db21d.jpg"
        alt="Scan QRIS"
        class="qris-img"
        onclick="openQrisModal(this.src)"
        title="Perbesar QRIS">

      <a
        href="https://saweria.co/capllang/"
        target="_blank"
        rel="noopener noreferrer"
        class="btn-donate-link">
        Saweria
      </a>

    </div>
  </div>

</div>

<!-- ADMIN LOGIN MODAL -->
<div
  id="adminModal"
  class="qris-modal"
  style="display: none;"
  onclick="closeAdminModal()">

  <div
    class="admin-modal-content"
    onclick="event.stopPropagation()">

    <h3 style="color: var(--text-title); font-size: 0.95rem; margin-bottom: 10px;">
      🔑 Autentikasi Pemilik
    </h3>

    <p style="color: var(--text-muted); font-size: 0.75rem; margin-bottom: 12px;">
      Masukkan password admin untuk mengakses panel kontrol.
    </p>

    <input
      type="password"
      id="adminPasswordInput"
      placeholder="Password admin..."
      style="width: 100%; padding: 10px 14px; font-size: 0.825rem; background: var(--input-bg); color: var(--text-title); border: 1px solid var(--input-border); border-radius: 10px; outline: none; margin-bottom: 12px;"
      onkeydown="handleAdminModalKeyDown(event)">

    <div style="display: flex; gap: 8px;">

      <button
        class="btn btn-confirm-cancel"
        style="flex: 1;"
        onclick="closeAdminModal()">
        Batal
      </button>

      <button
        class="btn btn-add"
        style="flex: 1;"
        onclick="submitAdminLogin()">
        Masuk
      </button>

    </div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div
  id="confirmModal"
  class="qris-modal"
  style="display: none;"
  onclick="closeConfirmModal(false)">

  <div
    class="confirm-modal-content"
    onclick="event.stopPropagation()">

    <div class="confirm-title" id="confirmTitle">
      Konfirmasi
    </div>

    <div class="confirm-message" id="confirmMessage">
      Apakah Anda yakin?
    </div>

    <div class="confirm-actions">

      <button
        class="btn btn-confirm-cancel"
        onclick="closeConfirmModal(false)">
        Batal
      </button>

      <button
        class="btn btn-confirm-danger"
        id="confirmOkBtn"
        onclick="closeConfirmModal(true)">
        Hapus
      </button>

    </div>
  </div>
</div>

<!-- QRIS MODAL -->
<div
  id="qrisModal"
  class="qris-modal"
  onclick="closeQrisModal()">

  <img
    id="modalImg"
    src=""
    alt="QRIS Preview"
    onclick="event.stopPropagation()">

</div>

<div id="toast" class="toast">
  Berhasil disalin!
</div>

<script>
const PROXY_URL = "https://jsonbin-proxy.awak-cot-u-sibak.workers.dev";

let database = {
  rekening: [],
  genshin: [],
  lastUpdated: null,
  infoTambahan: []
};

let isAdmin = false;
let activeTab = 'rekening';
let searchTimeout = null;

const PAGE_SIZE = 50;
let renderLimit = PAGE_SIZE;

let adminSessionActive = false;
let isLoading = false;

const BANK_OPTIONS = [
  "BCA",
  "BRI",
  "Mandiri",
  "BNI",
  "BSI",
  "DANA",
  "OVO",
  "GoPay",
  "ShopeePay",
  "Seabank",
  "Jago",
  "Blu",
  "Lainnya..."
];

const GAME_OPTIONS = [
  "Genshin Impact",
  "Honkai: Star Rail",
  "Zenless Zone Zero",
  "Mobile Legends",
  "Free Fire",
  "PUBG Mobile",
  "Roblox",
  "Valorant",
  "Lainnya..."
];

/* =========================
   LOADING STATE
========================= */

function setLoading(state, text = "Memuat...") {
  isLoading = state;

  const indicator = document.getElementById('loadingIndicator');
  const loadingText = document.getElementById('loadingText');

  if (!indicator) return;

  loadingText.textContent = text;
  indicator.classList.toggle('show', state);
}

/* =========================
   DATA MIGRATION
========================= */

function migrateData(dataArray) {
  if (!Array.isArray(dataArray)) return [];

  return dataArray.map(item => {

    if (item === null || item === undefined) {
      return {
        nomor: "-",
        tanggal: "-",
        meta: "-"
      };
    }

    if (typeof item !== 'object') {
      return {
        nomor: String(item),
        tanggal: "-",
        meta: "-"
      };
    }

    return {
      nomor: item.nomor ? String(item.nomor) : "",
      tanggal: item.tanggal ? String(item.tanggal) : "-",
      meta:
        (item.meta || item.bank || item.game)
          ? String(item.meta || item.bank || item.game)
          : "-"
    };
  });
}

/* =========================
   META SELECT
========================= */

function updateMetaSelectOptions() {
  const select = document.getElementById('metaSelectInput');
  const customInput = document.getElementById('metaCustomInput');

  if (!select) return;

  select.innerHTML = '';

  const defaultOpt = document.createElement('option');

  defaultOpt.value = "";
  defaultOpt.textContent =
    activeTab === 'rekening'
      ? "-- Pilih Bank (Opsional) --"
      : "-- Pilih Game (Opsional) --";

  defaultOpt.selected = true;

  select.appendChild(defaultOpt);

  const options =
    activeTab === 'rekening'
      ? BANK_OPTIONS
      : GAME_OPTIONS;

  options.forEach(opt => {
    const el = document.createElement('option');

    el.value = opt;
    el.textContent = opt;

    select.appendChild(el);
  });

  customInput.style.display = 'none';
  customInput.value = '';
}

function handleMetaSelectChange(selectEl) {
  const customInput =
    document.getElementById('metaCustomInput');

  if (selectEl.value === 'Lainnya...') {

    customInput.style.display = 'block';
    customInput.focus();

  } else {

    customInput.style.display = 'none';
    customInput.value = '';

  }
}

    document.body.classList.contains('dark-mode');

  localStorage.setItem(
    'theme',
    isDark ? 'dark' : 'light'

/* =========================
   HOME
========================= */

function resetToHome() {

  const url = new URL(window.location.href);

  url.searchParams.delete('search');
  url.searchParams.delete('q');
  url.searchParams.delete('tab');

  window.history.replaceState(
    {},
    '',
    url.pathname + url.search + url.hash
  );

  document.getElementById('searchInput').value = '';

  switchTab('rekening');

  const resultList =
    document.getElementById('resultList');

  if (resultList) {
    resultList.scrollTop = 0;
  }

  showToast("Kembali ke Halaman Utama");
}

/* =========================
   URL
========================= */

function checkUrlParams() {

  const urlParams =
    new URLSearchParams(window.location.search);

  const searchQuery =
    urlParams.get('search') ||
    urlParams.get('q');

  const tabQuery =
    urlParams.get('tab');

  if (
    tabQuery &&
    (tabQuery === 'rekening' ||
     tabQuery === 'genshin')
  ) {

    activeTab = tabQuery;

    document
      .getElementById('tabRekening')
      .classList.toggle(
        'active',
        activeTab === 'rekening'
      );

    document
      .getElementById('tabGenshin')
      .classList.toggle(
        'active',
        activeTab === 'genshin'
      );
  }

  if (searchQuery) {
    document.getElementById('searchInput').value =
      searchQuery;
  }
}

function updateUrlParam(query) {

  const url =
    new URL(window.location.href);

  const currentQuery =
    url.searchParams.get('search') || '';

  if (query === currentQuery) {
    return;
  }

  if (query) {
    url.searchParams.set('search', query);
  } else {
    url.searchParams.delete('search');
  }

  window.history.replaceState(
    {},
    '',
    url.pathname +
    (url.search ? url.search : '') +
    url.hash
  );
}

/* =========================
   FETCH DATABASE
========================= */

async function fetchOnlineDatabase() {

  const status =
    document.getElementById('statusBar');

  const controller =
    new AbortController();

  const timeoutId =
    setTimeout(
      () => controller.abort(),
      5000
    );

  setLoading(true, "Memperbarui database...");

  try {

    status.innerText =
      "⏳ Memperbarui server...";

    const res =
      await fetch(PROXY_URL, {
        signal: controller.signal,
        cache: 'no-store'
      });

    clearTimeout(timeoutId);

    if (!res.ok) {
      throw new Error(
        "Gagal terhubung ke Worker"
      );
    }

    const data =
      await res.json();

    const actualData =
      data.record ? data.record : data;

    if (
      actualData &&
      Array.isArray(actualData.rekening) &&
      Array.isArray(actualData.genshin)
    ) {

      database = actualData;

      database.rekening =
        migrateData(database.rekening);

      database.genshin =
        migrateData(database.genshin);

      localStorage.setItem(
        'cached_scammer_db',
        JSON.stringify(database)
      );

      status.innerText =
        "🟢 Terhubung ke server dengan sempurna.";

    } else {

      throw new Error(
        "Format struktur data tidak sesuai"
      );
    }

  } catch (err) {

    console.warn(
      "Menggunakan cache lokal:",
      err
    );

    const cached =
      localStorage.getItem(
        'cached_scammer_db'
      );

    if (cached) {

      try {

        database =
          JSON.parse(cached);

        database.rekening =
          migrateData(
            database.rekening || []
          );

        database.genshin =
          migrateData(
            database.genshin || []
          );

        status.innerText =
          "🟡 Mode Offline: Data cache digunakan.";

      } catch (e) {

        database = {
          rekening: [],
          genshin: [],
          lastUpdated: null,
          infoTambahan: []
        };

        status.innerText =
          "🔴 Mode Offline: Cache tidak tersedia.";
      }

    } else {

      status.innerText =
        "🔴 Mode Offline: Tidak ada cache.";
    }

  } finally {

    clearTimeout(timeoutId);
    setLoading(false);
  }

  checkUrlParams();
  updateMetaSelectOptions();
  filterData();
}

/* =========================
   SAVE DATABASE
========================= */

async function saveOnlineDatabase() {

  const status =
    document.getElementById('statusBar');

  status.innerText =
    "⏳ Menyimpan data...";

  if (!isAdmin || !adminSessionActive) {

    await showConfirm({
      title: "Sesi Admin Berakhir",
      message:
        "Sesi admin tidak lagi aktif. Silakan login kembali.",
      confirmText: "OK",
      danger: false
    });

    exitAdminMode();

    return false;
  }

  database.lastUpdated =
    new Date().toISOString();

  setLoading(true, "Menyimpan data...");

  try {

    const res =
      await fetch(PROXY_URL, {
        method: 'PUT',
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(database)
      });

    if (
      res.status === 401 ||
      res.status === 403
    ) {

      await showConfirm({
        title: "Akses Ditolak",
        message:
          "Sesi Admin telah berakhir atau akses ditolak oleh server.",
        confirmText: "OK",
        danger: false
      });

      exitAdminMode();

      status.innerText =
        "⚠️ Autentikasi Gagal";

      return false;
    }

    if (!res.ok) {
      throw new Error(
        "Gagal menyimpan data ke server"
      );
    }

    localStorage.setItem(
      'cached_scammer_db',
      JSON.stringify(database)
    );

    status.innerText =
      "🟢 Tersimpan di server!";

    return true;

  } catch (err) {

    console.error(
      "Save database error:",
      err
    );

    await showConfirm({
      title: "Penyimpanan Gagal",
      message:
        "Data gagal diperbarui ke server karena masalah jaringan atau server.",
      confirmText: "OK",
      danger: false
    });

    status.innerText =
      "⚠️ Simpan gagal";

    return false;

  } finally {

    setLoading(false);
  }
}

/* =========================
   ADMIN
========================= */

function exitAdminMode() {

  isAdmin = false;
  adminSessionActive = false;

  document.getElementById('authBtn').innerText =
    "🔑 Mode Pemilik";

  document.getElementById('addBox').style.display =
    "none";

  filterData();
}

function toggleAdmin() {

  if (!isAdmin) {

    document.getElementById('adminModal').style.display =
      'flex';

    const pwdInput =
      document.getElementById(
        'adminPasswordInput'
      );

    pwdInput.value = '';
    pwdInput.focus();

  } else {

    exitAdminMode();

    showToast(
      "Keluar Mode Pemilik"
    );
  }
}

function closeAdminModal() {

  document.getElementById('adminModal').style.display =
    'none';
}

function handleAdminModalKeyDown(e) {

  if (e.key === 'Enter') {
    submitAdminLogin();
  }
}

async function submitAdminLogin() {

  const inputSecret =
    document.getElementById(
      'adminPasswordInput'
    ).value;

  if (
    !inputSecret ||
    inputSecret.trim() === ""
  ) {

    showToast(
      "⚠️ Password Admin wajib diisi!"
    );

    return;
  }

  const cleanSecret =
    inputSecret.trim();

  const submitBtn =
    document.querySelector(
      '#adminModal .btn-add'
    );

  const originalBtnText =
    submitBtn.innerText;

  submitBtn.disabled = true;
  submitBtn.innerText =
    "Verifikasi...";

  setLoading(
    true,
    "Memverifikasi admin..."
  );

  try {

    const res =
      await fetch(
        `${PROXY_URL}/auth/login`,
        {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type':
              'application/json'
          },
          body: JSON.stringify({
            password: cleanSecret
          })
        }
      );

    if (
      res.status === 401 ||
      res.status === 403
    ) {

      showToast(
        "❌ Password Admin Salah!"
      );

      return;
    }

    if (!res.ok) {

      throw new Error(
        "Gagal login ke server"
      );
    }

    /*
     * Tidak menyimpan password/token/session
     * ke JavaScript.
     *
     * Session ditangani oleh cookie
     * HttpOnly dari server.
     */
    isAdmin = true;
    adminSessionActive = true;

    document.getElementById('authBtn').innerText =
      "🔓 Keluar Mode";

    document.getElementById('addBox').style.display =
      "flex";

    document.getElementById('newDateInput')
      .valueAsDate = new Date();

    updateMetaSelectOptions();

    closeAdminModal();

    showToast(
      "Mode Pemilik Aktif"
    );

    filterData();

  } catch (err) {

    console.error(
      "Login error:",
      err
    );

    showToast(
      "⚠️ Gagal login: masalah jaringan/server."
    );

  } finally {

    submitBtn.disabled = false;
    submitBtn.innerText =
      originalBtnText;

    setLoading(false);
  }
}

/* =========================
   ADD DATA
========================= */

function handleInputKeyDown(e) {

  if (e.key === 'Enter') {
    addNumber();
  }
}

async function addNumber() {

  const input =
    document.getElementById(
      'newNumberInput'
    );

  const dateInput =
    document.getElementById(
      'newDateInput'
    );

  const btnAdd =
    document.getElementById(
      'btnAdd'
    );

  const selectMeta =
    document.getElementById(
      'metaSelectInput'
    );

  const customMetaInput =
    document.getElementById(
      'metaCustomInput'
    );

  let selectedMeta =
    selectMeta.value;

  const rawVal =
    input.value.trim();

  const dateVal =
    dateInput.value;

  if (!rawVal) {

    showToast(
      "⚠️ Masukkan nomor/UID baru!"
    );

    return;
  }

  if (
    !selectedMeta ||
    selectedMeta === ""
  ) {

    selectedMeta = "-";

  } else if (
    selectedMeta === 'Lainnya...'
  ) {

    selectedMeta =
      customMetaInput.value.trim();

    if (!selectedMeta) {
      selectedMeta = "-";
    }
  }

  if (!dateVal) {

    showToast(
      "⚠️ Tanggal wajib diisi!"
    );

    return;
  }

  /*
   * Normalisasi input:
   * hanya angka yang disimpan.
   */
  const cleanVal =
    rawVal.replace(/\D/g, '');

  if (activeTab === 'genshin') {

    if (!/^\d{5,12}$/.test(cleanVal)) {

      showToast(
        "⚠️ UID harus 5 - 12 digit."
      );

      return;
    }

  } else if (
    activeTab === 'rekening'
  ) {

    if (!/^\d{5,25}$/.test(cleanVal)) {

      showToast(
        "⚠️ Nomor harus 5 - 25 digit."
      );

      return;
    }
  }

  const exists =
    database[activeTab].some(item => {

      const num =
        typeof item === 'object'
          ? item.nomor
          : item;

      return String(num) === cleanVal;
    });

  if (exists) {

    showToast(
      "⚠️ Nomor/UID sudah ada!"
    );

    return;
  }

  btnAdd.disabled = true;
  btnAdd.innerText =
    "⏳ Menyimpan...";

  const newItem = {
    nomor: cleanVal,
    tanggal: dateVal,
    meta: selectedMeta
  };

  database[activeTab].unshift(
    newItem
  );

  const success =
    await saveOnlineDatabase();

  if (success) {

    input.value = "";
    customMetaInput.value = "";

    updateMetaSelectOptions();

    document.getElementById(
      'searchInput'
    ).value = "";

    renderLimit = PAGE_SIZE;

    filterData();

    showToast(
      "Data & info berhasil ditambahkan!"
    );

  } else {

    database[activeTab].shift();
  }

  btnAdd.disabled = false;
  btnAdd.innerText =
    "+ Simpan Data";
}

/* =========================
   CUSTOM CONFIRM
========================= */

let confirmResolver = null;

function showConfirm({
  title = "Konfirmasi",
  message = "Apakah Anda yakin?",
  confirmText = "OK",
  danger = true
} = {}) {

  return new Promise(resolve => {

    confirmResolver = resolve;

    document.getElementById(
      'confirmTitle'
    ).textContent = title;

    document.getElementById(
      'confirmMessage'
    ).textContent = message;

    const btn =
      document.getElementById(
        'confirmOkBtn'
      );

    btn.textContent =
      confirmText;

    btn.className =
      danger
        ? "btn btn-confirm-danger"
        : "btn btn-add";

    document.getElementById(
      'confirmModal'
    ).style.display = 'flex';
  });
}

function closeConfirmModal(result) {

  document.getElementById(
    'confirmModal'
  ).style.display = 'none';

  if (confirmResolver) {

    const resolver =
      confirmResolver;

    confirmResolver = null;

    resolver(result);
  }
}

/* =========================
   DELETE
========================= */

async function deleteNumber(
  itemObj,
  btnEl
) {

  const nomorStr =
    typeof itemObj === 'object'
      ? String(itemObj.nomor)
      : String(itemObj);

  const confirmed =
    await showConfirm({
      title: "Hapus Data?",
      message:
        `Data "${nomorStr}" akan dihapus dari database. Tindakan ini tidak dapat dibatalkan.`,
      confirmText: "Hapus",
      danger: true
    });

  if (!confirmed) return;

  const index =
    database[activeTab]
      .indexOf(itemObj);

  if (index > -1) {

    if (btnEl) {
      btnEl.disabled = true;
    }

    const originalData =
      [...database[activeTab]];

    database[activeTab]
      .splice(index, 1);

    const success =
      await saveOnlineDatabase();

    if (success) {

      filterData();

      showToast(
        "Data dihapus!"
      );

    } else {

      database[activeTab] =
        originalData;

      if (btnEl) {
        btnEl.disabled = false;
      }
    }
  }
}

/* =========================
   TABS
========================= */

function switchTab(tab) {

  activeTab = tab;

  renderLimit =
    PAGE_SIZE;

  document
    .getElementById('tabRekening')
    .classList.toggle(
      'active',
      tab === 'rekening'
    );

  document
    .getElementById('tabGenshin')
    .classList.toggle(
      'active',
      tab === 'genshin'
    );

  const input =
    document.getElementById(
      'searchInput'
    );

  input.placeholder =
    tab === 'rekening'
      ? "Tulis nomor rekening di sini..."
      : "Tulis UID game di sini...";

  updateMetaSelectOptions();

  filterData();
}

/* =========================
   SEARCH NORMALIZATION
========================= */

function normalizeSearchValue(value) {

  return String(value || '')
    .toLowerCase()
    .replace(/[^a-z0-9]/g, '');
}

/* =========================
   EVENT RESULT LIST
========================= */

document
  .getElementById('resultList')
  .addEventListener(
    'click',
    async (e) => {

      const target =
        e.target;

      /*
       * Pagination diperbaiki:
       * tombol sekarang benar-benar
       * bekerja karena elemen load-more
       * ditambahkan ke fragment/resultList.
       */
      if (
        target.classList.contains(
          'btn-load-more'
        )
      ) {

        target.disabled = true;
        target.textContent =
          "Memuat...";

        renderLimit += PAGE_SIZE;

        filterData();

        return;
      }

      const itemEl =
        target.closest(
          '.result-item'
        );

      if (!itemEl) return;

      const nomorStr =
        itemEl.dataset.nomor;

      const itemObj =
        database[activeTab].find(
          i =>
            (
              typeof i === 'object'
                ? String(i.nomor)
                : String(i)
            ) === nomorStr
        );

      if (
        target.classList.contains(
          'btn-delete'
        )
      ) {

        e.stopPropagation();

        await deleteNumber(
          itemObj,
          target
        );

      } else if (
        target.classList.contains(
          'btn-icon'
        )
      ) {

        e.stopPropagation();

        copyReportTemplate(
          itemObj || nomorStr
        );

      } else {

        copyToClipboard(
          nomorStr,
          `Disalin: ${nomorStr}`
        );
      }
    }
  );

/* =========================
   COPY TEMPLATE
========================= */

function copyReportTemplate(itemObj) {

  const nomorStr =
    typeof itemObj === 'object'
      ? itemObj.nomor
      : itemObj;

  const metaStr =
    typeof itemObj === 'object'
      ? (
          itemObj.meta ||
          itemObj.bank ||
          itemObj.game ||
          '-'
        )
      : '-';

  const tanggalStr =
    typeof itemObj === 'object'
      ? itemObj.tanggal
      : '-';

  const template =
`🚨 LAPORAN PENIPUAN 🚨

Nomor/UID: ${nomorStr}
Platform/Bank: ${metaStr}
Tanggal Terdata: ${tanggalStr}

Hati-hati terhadap modus penipuan dengan informasi di atas!`;

  copyToClipboard(
    template,
    'Template laporan disalin!'
  );
}

/* =========================
   FILTER + PAGINATION
========================= */

function filterData() {

  try {

    const rawQuery =
      document
        .getElementById('searchInput')
        .value
        .trim()
        .toLowerCase();

    const cleanQuery =
      normalizeSearchValue(
        rawQuery
      );

    /*
     * URL hanya diperbarui jika
     * query benar-benar berubah.
     */
    updateUrlParam(
      rawQuery
    );

    const resultList =
      document.getElementById(
        'resultList'
      );

    const counter =
      document.getElementById(
        'dataCounter'
      );

    while (
      resultList.firstChild
    ) {
      resultList.removeChild(
        resultList.firstChild
      );
    }

    const currentData =
      database[activeTab] || [];

    /*
     * Untuk pencarian besar:
     * normalisasi query dilakukan
     * satu kali.
     */
    const filtered =
      currentData.filter(item => {

        if (rawQuery === '') {
          return true;
        }

        const nomorStr =
          typeof item === 'object'
            ? String(item.nomor || '')
            : String(item);

        const tanggalStr =
          typeof item === 'object'
            ? String(
                item.tanggal || ''
              ).toLowerCase()
            : '';

        const metaStr =
          typeof item === 'object'
            ? String(
                item.meta ||
                item.bank ||
                item.game ||
                ''
              ).toLowerCase()
            : '';

        const nomorLower =
          nomorStr.toLowerCase();

        const nomorNormalized =
          normalizeSearchValue(
            nomorStr
          );

        return (
          nomorLower.includes(
            rawQuery
          ) ||
          (
            cleanQuery !== '' &&
            nomorNormalized.includes(
              cleanQuery
            )
          ) ||
          tanggalStr.includes(
            rawQuery
          ) ||
          metaStr.includes(
            rawQuery
          )
        );
      });

    counter.textContent =
      `${filtered.length} Data`;

    if (
      filtered.length === 0
    ) {

      const emptyLi =
        document.createElement(
          'li'
        );

      emptyLi.className =
        'empty-msg';

      emptyLi.textContent =
        'Tidak ada data ditemukan.';

      resultList.appendChild(
        emptyLi
      );

      return;
    }

    const visibleData =
      filtered.slice(
        0,
        renderLimit
      );

    const fragment =
      document.createDocumentFragment();

    visibleData.forEach(item => {

      const nomorStr =
        typeof item === 'object'
          ? String(item.nomor)
          : String(item);

      const tanggalStr =
        typeof item === 'object'
          ? String(
              item.tanggal || '-'
            )
          : '-';

      const metaStr =
        typeof item === 'object'
          ? String(
              item.meta ||
              item.bank ||
              item.game ||
              '-'
            )
          : '-';

      const li =
        document.createElement(
          'li'
        );

      li.className =
        'result-item';

      li.dataset.nomor =
        nomorStr;

      li.title =
        "Klik untuk menyalin nomor";

      const numberSpan =
        document.createElement(
          'span'
        );

      numberSpan.className =
        'number';

      numberSpan.textContent =
        nomorStr;

      const rightContent =
        document.createElement(
          'div'
        );

      rightContent.className =
        'right-content';

      if (
        metaStr &&
        metaStr !== '-'
      ) {

        const metaSpan =
          document.createElement(
            'span'
          );

        metaSpan.className =
          'badge-meta';

        metaSpan.textContent =
          metaStr;

        rightContent.appendChild(
          metaSpan
        );
      }

      if (
        tanggalStr !== '-' &&
        tanggalStr.length > 0
      ) {

        const dateSpan =
          document.createElement(
            'span'
          );

        dateSpan.className =
          'badge-date';

        const dParts =
          tanggalStr.includes('-')
            ? tanggalStr.split('-')
            : [tanggalStr];

        const formattedDate =
          dParts.length === 3
            ? `${dParts[2]}/${dParts[1]}/${dParts[0]}`
            : tanggalStr;

        dateSpan.textContent =
          formattedDate;

        rightContent.appendChild(
          dateSpan
        );
      }

      const copyBtn =
        document.createElement(
          'button'
        );

      copyBtn.className =
        'btn-icon';

      copyBtn.title =
        'Salin Template Laporan';

      copyBtn.setAttribute(
        'aria-label',
        'Salin Template Laporan'
      );

      copyBtn.textContent =
        '📢';

      rightContent.appendChild(
        copyBtn
      );

      if (isAdmin) {

        const deleteBtn =
          document.createElement(
            'button'
          );

        deleteBtn.className =
          'btn btn-delete';

        deleteBtn.textContent =
          'Hapus';

        rightContent.appendChild(
          deleteBtn
        );
      }

      li.appendChild(
        numberSpan
      );

      li.appendChild(
        rightContent
      );

      fragment.appendChild(
        li
      );
    });

    /*
     * FIX BUG "MUAT LEBIH BANYAK":
     *
     * Sebelumnya loadMoreLi dibuat tetapi
     * tidak pernah dimasukkan ke DOM.
     *
     * Sekarang benar-benar di-append ke fragment.
     */
    if (
      filtered.length > renderLimit
    ) {

      const loadMoreLi =
        document.createElement(
          'li'
        );

      loadMoreLi.className =
        'load-more-container';

      const loadMoreBtn =
        document.createElement(
          'button'
        );

      loadMoreBtn.className =
        'btn btn-load-more';

      loadMoreBtn.textContent =
        `Muat Lebih Banyak (${Math.min(
          PAGE_SIZE,
          filtered.length - renderLimit
        )})`;

      loadMoreLi.appendChild(
        loadMoreBtn
      );

      /*
       * INI PERBAIKAN UTAMANYA.
       */
      fragment.appendChild(
        loadMoreLi
      );
    }

    resultList.appendChild(
      fragment
    );

  } catch (error) {

    console.error(
      "Terjadi masalah saat merender list:",
      error
    );

    const resultList =
      document.getElementById(
        'resultList'
      );

    while (
      resultList.firstChild
    ) {
      resultList.removeChild(
        resultList.firstChild
      );
    }

    const errLi =
      document.createElement(
        'li'
      );

    errLi.className =
      'empty-msg';

    errLi.style.color =
      '#e11d48';

    errLi.textContent =
      'Terjadi kendala saat membaca data. Coba muat ulang halaman.';

    resultList.appendChild(
      errLi
    );
  }
}

/* =========================
   SEARCH EVENT
========================= */

document
  .getElementById('searchInput')
  .addEventListener(
    'input',
    () => {

      clearTimeout(
        searchTimeout
      );

      searchTimeout =
        setTimeout(() => {

          renderLimit =
            PAGE_SIZE;

          filterData();

        }, 250);
    }
  );

/* =========================
   KEYBOARD SEARCH
========================= */

document.addEventListener(
  'keydown',
  (e) => {

    const searchInput =
      document.getElementById(
        'searchInput'
      );

    if (
      e.key === '/' &&
      document.activeElement !== searchInput &&
      document.activeElement.tagName !== 'INPUT' &&
      document.activeElement.tagName !== 'TEXTAREA'
    ) {

      e.preventDefault();

      searchInput.focus();
    }
  }
);

/* =========================
   CLIPBOARD
========================= */

function copyToClipboard(
  text,
  toastMessage = 'Berhasil disalin!'
) {

  if (
    navigator.clipboard &&
    window.isSecureContext
  ) {

    navigator.clipboard
      .writeText(text)
      .then(() => {

        showToast(
          toastMessage
        );

      })
      .catch(err => {

        console.error(
          'Gagal menyalin:',
          err
        );

        fallbackCopy(
          text,
          toastMessage
        );
      });

  } else {

    fallbackCopy(
      text,
      toastMessage
    );
  }
}

function fallbackCopy(
  text,
  toastMessage
) {

  const textarea =
    document.createElement(
      'textarea'
    );

  textarea.value =
    text;

  textarea.style.position =
    'fixed';

  textarea.style.opacity =
    '0';

  document.body.appendChild(
    textarea
  );

  textarea.select();

  try {

    document.execCommand(
      'copy'
    );

    showToast(
      toastMessage
    );

  } catch (err) {

    console.error(
      'Gagal menyalin:',
      err
    );

    showToast(
      'Gagal menyalin ke clipboard.'
    );

  } finally {

    document.body.removeChild(
      textarea
    );
  }
}

/* =========================
   TOAST
========================= */

function showToast(message) {

  const toast =
    document.getElementById(
      'toast'
    );

  toast.textContent =
    message;

  toast.classList.add(
    'show'
  );

  setTimeout(() => {

    toast.classList.remove(
      'show'
    );

  }, 3000);
}

/* =========================
   QRIS
========================= */

function openQrisModal(src) {

  document.getElementById(
    'modalImg'
  ).src = src;

  document.getElementById(
    'qrisModal'
  ).style.display =
    'flex';
}

function closeQrisModal() {

  document.getElementById(
    'qrisModal'
  ).style.display =
    'none';
}
