<html lang="id">
<head>

  <!-- Open Graph -->
  <meta property="og:type" content="website">

  <meta property="og:site_name" content="Capllang">
  <meta property="og:title" content="Cek Rekening Scammer & UID HB | Capllang">
  <meta property="og:description" content="Cek daftar rekening yang dilaporkan scammer dan UID HB dalam database Capllang sebelum melakukan transaksi atau pengecekan akun.">
  <meta property="og:url" content="https://capllang-list.vercel.app/">

  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Cek Rekening Scammer & UID HB | Capllang">
  <meta name="twitter:description" content="Cek daftar rekening yang dilaporkan scammer dan UID HB dalam database Capllang sebelum melakukan transaksi atau pengecekan akun.">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      --outer-bg: #1e293b;
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(255, 255, 255, 0.9);
      --card-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);

      --text-main: #334155;
      --text-muted: #64748b;
      --text-title: #0f172a;

      --tab-bg: #f1f5f9;
      --tab-active-bg: #ffffff;
      --tab-active-text: #4f46e5;
      --tab-active-shadow: 0 4px 12px rgba(79, 70, 229, 0.12);

      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-focus: #6366f1;

      --item-bg: #ffffff;
      --item-border: #fecdd3;

      --date-badge: #64748b;
      --date-badge-bg: #f1f5f9;

      --meta-badge: #4338ca;
      --meta-badge-bg: #eef2ff;
      --meta-badge-border: #c7d2fe;

      --btn-primary: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      --btn-admin: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      --btn-add: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --btn-delete: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);

      --donate-bg: rgba(254, 243, 199, 0.6);
      --donate-border: rgba(252, 211, 77, 0.7);
      --scrollbar-thumb: #cbd5e1;
    }

    body.dark-mode {
      --outer-bg: #e2e8f0;
      --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 100%);
      --card-bg: rgba(17, 24, 39, 0.82);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);

      --text-main: #cbd5e1;
      --text-muted: #94a3b8;
      --text-title: #f8fafc;

      --tab-bg: rgba(15, 23, 42, 0.6);
      --tab-active-bg: #1e293b;
      --tab-active-text: #818cf8;
      --tab-active-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);

      --input-bg: rgba(15, 23, 42, 0.65);
      --input-border: #334155;
      --input-focus: #818cf8;

      --item-bg: #1e293b;
      --item-border: #881337;

      --date-badge: #cbd5e1;
      --date-badge-bg: rgba(15, 23, 42, 0.5);

      --meta-badge: #a5b4fc;
      --meta-badge-bg: rgba(99, 102, 241, 0.18);
      --meta-badge-border: #4338ca;

      --btn-primary: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --btn-admin: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      --btn-add: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --btn-delete: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);

      --donate-bg: rgba(120, 53, 15, 0.2);
      --donate-border: rgba(180, 83, 9, 0.3);
      --scrollbar-thumb: #334155;
    }

    * {
      box-sizing: border-box;
      font-family: var(--font-family);
      margin: 0;
      padding: 0;
    }

    body, .container, .tab-btn, .btn, .result-item, input, select {
      transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      background: var(--outer-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      height: 92dvh;
      max-height: 850px;
      background: var(--bg-gradient);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
    }

    @media (min-width: 640px) {
      body {
        padding: 24px;
      }

      .container {
        max-width: 540px;
        height: 88dvh;
        border-radius: 24px;
        padding: 24px;
      }
    }

    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(156, 163, 175, 0.12);
      flex-shrink: 0;
    }

    h2 {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-title);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    h2:hover {
      opacity: 0.75;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-theme,
    .btn-header-admin {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--input-border);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-theme:hover,
    .btn-header-admin:hover {
      background: var(--input-border);
      color: var(--text-title);
    }

    .status-bar-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .status-bar {
      font-size: 0.725rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--input-bg);
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--input-border);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .data-counter {
      font-size: 0.725rem;
      font-weight: 600;
      color: var(--text-title);
      background: var(--input-bg);
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid var(--input-border);
      white-space: nowrap;
    }

    .tabs {
      display: flex;
      background: var(--tab-bg);
      padding: 4px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: transparent;
      border: none;
      font-size: 0.825rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      border-radius: 8px;
    }

    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      box-shadow: var(--tab-active-shadow);
    }

    .search-box,
    .admin-panel {
      flex-shrink: 0;
    }

    .search-box input,
    .admin-box input,
    .admin-box select {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.825rem;
      background: var(--input-bg);
      color: var(--text-title);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      outline: none;
    }

    .admin-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .admin-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--input-bg);
      border: 1px dashed var(--input-focus);
      padding: 8px 10px;
      border-radius: 12px;
    }

    .admin-inputs {
      display: flex;
      gap: 6px;
      width: 100%;
      flex-wrap: wrap;
    }

    .admin-inputs input,
    .admin-inputs select {
      padding: 7px 10px;
      font-size: 0.78rem;
    }

    .search-box input:focus,
    .admin-box input:focus,
    .admin-box select:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-add {
      background: var(--btn-add);
      width: 100%;
      padding: 8px 16px;
    }

    .btn-delete {
      background: var(--btn-delete);
      padding: 5px 8px;
      font-size: 0.7rem;
      border-radius: 6px;
    }

    .btn-load-more {
      background: var(--btn-admin);
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.8rem;
    }

    .result-list {
      list-style: none;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
      scroll-behavior: smooth;
    }

    .result-list::-webkit-scrollbar {
      width: 5px;
    }

    .result-list::-webkit-scrollbar-thumb {
      background-color: var(--scrollbar-thumb);
      border-radius: 10px;
    }

    .result-item {
      background: var(--item-bg);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--item-border);
      padding: 12px 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      flex-shrink: 0;
      cursor: pointer;
    }

    .result-item .number {
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      word-break: break-all;
      color: var(--text-title);
    }

    .right-content {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge-date {
      background: var(--date-badge-bg);
      color: var(--date-badge);
      border: 1px solid var(--input-border);
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-meta {
      background: var(--meta-badge-bg);
      color: var(--meta-badge);
      border: 1px solid var(--meta-badge-border);
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 700;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--input-border);
      border-radius: 6px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .btn-icon:hover {
      background: var(--input-border);
      color: var(--text-title);
    }

    .empty-msg,
    .load-more-container {
      text-align: center;
      color: var(--text-muted);
      padding: 12px;
      font-size: 0.85rem;
      list-style: none;
    }

    .donation-section {
      background: var(--donate-bg);
      border: 1px solid var(--donate-border);
      border-radius: 14px;
      padding: 12px 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .donation-title {
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--text-title);
    }

    .donation-action {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qris-img {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      cursor: pointer;
    }

    .btn-donate-link {
      background: #f59e0b;
      color: #ffffff;
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
      white-space: nowrap;
    }

    .qris-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .qris-modal img {
      max-width: 85%;
      max-height: 75%;
      border-radius: 16px;
      background: #ffffff;
      padding: 12px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }

    .admin-modal-content,
    .confirm-modal-content {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      padding: 20px;
      border-radius: 16px;
      width: 90%;
      max-width: 320px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }

    .confirm-modal-content {
      max-width: 340px;
    }

    .confirm-title {
      color: var(--text-title);
      font-size: 0.95rem;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .confirm-message {
      color: var(--text-muted);
      font-size: 0.78rem;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .confirm-actions {
      display: flex;
      gap: 8px;
    }

    .confirm-actions button {
      flex: 1;
    }

    .btn-confirm-cancel {
      background: var(--input-border);
      color: var(--text-main);
    }

    .btn-confirm-danger {
      background: var(--btn-delete);
    }

    .loading-indicator {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      color: var(--text-muted);
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .loading-indicator.show {
      display: flex;
    }

    .loading-spinner {
      width: 15px;
      height: 15px;
      border: 2px solid var(--input-border);
      border-top-color: var(--input-focus);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      z-index: 2000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }


    /* ACCESSIBILITY */
    :focus-visible {
      outline: 3px solid var(--input-focus);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header-area">
    <h2
      role="button"
      tabindex="0"
      aria-label="Kembali ke halaman utama"
      onclick="resetToHome()"
      onkeydown="handleActivationKey(event, resetToHome)"
      title="Kembali ke Halaman Utama">
      🛡️ UID HB & NO SCAMMER
    </h2>

    <div class="header-actions">
      <button type="button" id="authBtn" class="btn-header-admin" aria-pressed="false" onclick="toggleAdmin()">
        🔑 Mode Pemilik
      </button>

      <button type="button" id="themeToggleBtn" class="btn-theme" aria-label="Ganti tema" aria-pressed="false" onclick="toggleTheme()">
        Dark
      </button>
    </div>
  </div>

  <div class="status-bar-container">
    <div id="statusBar" class="status-bar" role="status" aria-live="polite" aria-atomic="true">
      Memuat data online...
    </div>

    <div id="dataCounter" class="data-counter" aria-live="polite" aria-atomic="true">
      0 Data
    </div>
  </div>

  <div class="tabs" role="tablist" aria-label="Kategori database">
    <button
      type="button"
      class="tab-btn active"
      id="tabRekening"
      role="tab"
      aria-selected="true"
      tabindex="0"
      onclick="switchTab('rekening')"
      onkeydown="handleTabKeyDown(event)">
      LIST REK SCAMMER
    </button>

    <button
      type="button"
      class="tab-btn"
      id="tabGenshin"
      role="tab"
      aria-selected="false"
      tabindex="-1"
      onclick="switchTab('genshin')"
      onkeydown="handleTabKeyDown(event)">
      LIST UID HB
    </button>
  </div>

  <div class="admin-panel">
    <div id="addBox" class="admin-box" style="display: none;">

      <div class="admin-inputs">

        <select
          id="metaSelectInput"
          aria-label="Pilih bank atau game"
          style="flex: 1.2;"
          onchange="handleMetaSelectChange(this)">
        </select>

        <input
          type="text"
          id="metaCustomInput"
          aria-label="Nama bank atau game lainnya"
          style="flex: 1; display: none;"
          placeholder="Nama Bank/Game Lain...">

        <input
          type="text"
          id="newNumberInput"
          aria-label="Nomor rekening atau UID baru"
          inputmode="numeric"
          style="flex: 1.5;"
          placeholder="Nomor/UID baru..."
          onkeydown="handleInputKeyDown(event)">

        <input
          type="date"
          id="newDateInput"
          aria-label="Tanggal dilaporkan"
          style="flex: 1;"
          title="Tanggal Dilaporkan">

      </div>

      <button
        type="button"
        class="btn btn-add"
        id="btnAdd"
        onclick="addNumber()">
        + Simpan Data
      </button>

    </div>
  </div>

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      aria-label="Cari Rekening atau UID"
      placeholder="Tulis nomor rekening di sini..."
      autocomplete="off">
  </div>

  <div id="loadingIndicator" class="loading-indicator" role="status" aria-live="polite" aria-atomic="true">
    <span class="loading-spinner"></span>
    <span id="loadingText">Memuat...</span>
  </div>

  <ul class="result-list" id="resultList" aria-label="Hasil pencarian database"></ul>

  <div class="donation-section">
    <div class="donation-text">
      <span class="donation-title">
        ☕ Sawer Capllang
      </span>
    </div>

    <div class="donation-action">

      <img
        src="https://www.image2url.com/r2/default/images/1786971411556-c9bfbe24-e071-424f-b555-dc1d949db21d.jpg"
        alt="Scan QRIS"
        class="qris-img"
        role="button"
        tabindex="0"
        aria-label="Perbesar QRIS"
        aria-haspopup="dialog"
        aria-controls="qrisModal"
        onclick="openQrisModal(this.src)"
        onkeydown="handleQrisKeyDown(event, this.src)"
        title="Perbesar QRIS">

      <a
        href="https://saweria.co/capllang/"
        target="_blank"
        rel="noopener noreferrer"
        class="btn-donate-link">
        Saweria
      </a>

    </div>
  </div>

</div>

<!-- ADMIN LOGIN MODAL -->
<div
  id="adminModal"
  class="qris-modal"
  role="dialog"
  aria-modal="true"
  aria-hidden="true"
  aria-labelledby="adminModalTitle"
  aria-describedby="adminModalDesc"
  style="display: none;"
  onclick="closeAdminModal()">

  <div
    class="admin-modal-content"
    onclick="event.stopPropagation()">

    <h3 id="adminModalTitle" style="color: var(--text-title); font-size: 0.95rem; margin-bottom: 10px;">
      🔑 Autentikasi Pemilik
    </h3>

    <p id="adminModalDesc" style="color: var(--text-muted); font-size: 0.75rem; margin-bottom: 12px;">
      Masukkan password admin untuk mengakses panel kontrol.
    </p>

    <input
      type="password"
      id="adminPasswordInput"
      aria-label="Password admin"
      autocomplete="current-password"
      placeholder="Password admin..."

<script>
const PROXY_URL = "https://jsonbin-proxy.awak-cot-u-sibak.workers.dev";

let database = {
  rekening: [],
  genshin: [],
  lastUpdated: null,
  infoTambahan: []
};

let isAdmin = false;
let activeTab = 'rekening';
let searchTimeout = null;

const PAGE_SIZE = 50;

let adminSessionActive = false;
let isLoading = false;
let offlineMode = false;

const paginationState = {
  rekening: {
    total: 0,
    query: null,
    hasMore: false
  },
  genshin: {
    total: 0,
    query: null,
    hasMore: false
  }
};

const categoryControllers = {
  rekening: null,
  genshin: null
};

const modalPreviousFocus = new Map();

function handleActivationKey(event, action) {
  if (event.key === 'Enter' || event.key === ' ') {
    event.preventDefault();
    action();
  }
}

function handleQrisKeyDown(event, src) {
  if (event.key === 'Enter' || event.key === ' ') {
    event.preventDefault();
    openQrisModal(src);
  }
}

function getFocusableElements(container) {
  return Array.from(
    container.querySelectorAll(
      'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
    )
  ).filter(el => el.offsetParent !== null);
}

function openModalAccessible(modalId, focusSelector = null) {
  const modal = document.getElementById(modalId);
  if (!modal) return;

  modalPreviousFocus.set(modalId, document.activeElement);
  modal.style.display = 'flex';
  modal.setAttribute('aria-hidden', 'false');

  requestAnimationFrame(() => {
    const target = focusSelector
      ? modal.querySelector(focusSelector)
      : getFocusableElements(modal)[0];

    if (target) {
      target.focus();
    } else {
      modal.focus();
    }
  });
}

function closeModalAccessible(modalId) {
  const modal = document.getElementById(modalId);
  if (!modal) return;

  modal.style.display = 'none';
  modal.setAttribute('aria-hidden', 'true');

  const previous = modalPreviousFocus.get(modalId);
  modalPreviousFocus.delete(modalId);

  if (previous && typeof previous.focus === 'function') {
    previous.focus();
  }
}

function trapFocus(event, modal) {
  if (event.key !== 'Tab') return;

  const focusable = getFocusableElements(modal);
  if (focusable.length === 0) {
    event.preventDefault();
    return;
  }

  const first = focusable[0];
  const last = focusable[focusable.length - 1];

  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
}

function handleTabKeyDown(event) {
  if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) {
    return;
  }

  event.preventDefault();

  const tabs = [
    document.getElementById('tabRekening'),
    document.getElementById('tabGenshin')
  ];

  let index = tabs.indexOf(event.currentTarget);

  if (event.key === 'Home') index = 0;
  else if (event.key === 'End') index = tabs.length - 1;
  else if (event.key === 'ArrowRight') index = (index + 1) % tabs.length;
  else if (event.key === 'ArrowLeft') index = (index - 1 + tabs.length) % tabs.length;

  const next = tabs[index];
  switchTab(next.id === 'tabRekening' ? 'rekening' : 'genshin');
  next.focus();
}


const BANK_OPTIONS = [
  "BCA",
  "BRI",
  "Mandiri",
  "BNI",
  "BSI",
  "DANA",
  "OVO",
  "GoPay",
  "ShopeePay",
  "Seabank",
  "Jago",
  "Blu",
  "Lainnya..."
];

const GAME_OPTIONS = [
  "Genshin Impact",
  "Honkai: Star Rail",
  "Zenless Zone Zero",
  "Mobile Legends",
  "Free Fire",
  "PUBG Mobile",
  "Roblox",
  "Valorant",
  "Lainnya..."
];

/* =========================
   LOADING STATE
========================= */

function setLoading(state, text = "Memuat...") {
  isLoading = state;

  const indicator = document.getElementById('loadingIndicator');
  const loadingText = document.getElementById('loadingText');

  if (!indicator) return;

  loadingText.textContent = text;
  indicator.classList.toggle('show', state);
}

/* =========================
   DATA NORMALIZATION
========================= */

function migrateData(dataArray, fallbackCategory = "") {
  if (!Array.isArray(dataArray)) return [];

  return dataArray
    .map(item => {

      if (item === null || item === undefined) {
        return null;
      }

      if (typeof item !== 'object') {
        return {
          id: null,
          category: fallbackCategory,
          nomor: String(item),
          tanggal: "-",
          meta: "-"
        };
      }

      const rawId =
        item.id === null || item.id === undefined
          ? null
          : Number(item.id);

      return {
        id:
          Number.isSafeInteger(rawId) && rawId > 0
            ? rawId
            : null,
        category:
          item.category
            ? String(item.category)
            : fallbackCategory,
        nomor:
          item.nomor === null || item.nomor === undefined
            ? ""
            : String(item.nomor),
        tanggal:
          item.tanggal
            ? String(item.tanggal)
            : "-",
        meta:
          (item.meta || item.bank || item.game)
            ? String(item.meta || item.bank || item.game)
            : "-"
      };
    })
    .filter(item => item && item.nomor);
}

function sortRecords(dataArray) {
  dataArray.sort((a, b) => {
    const aDate =
      a.tanggal && a.tanggal !== '-'
        ? String(a.tanggal)
        : '';

    const bDate =
      b.tanggal && b.tanggal !== '-'
        ? String(b.tanggal)
        : '';

    if (aDate !== bDate) {
      return bDate.localeCompare(aDate);
    }

    return Number(b.id || 0) - Number(a.id || 0);
  });
}

function cacheDatabase() {
  const cachedState = {
    rekening: {
      total: paginationState.rekening.total,
      query: paginationState.rekening.query
    },
    genshin: {
      total: paginationState.genshin.total,
      query: paginationState.genshin.query
    }
  };

  localStorage.setItem(
    'cached_scammer_db',
    JSON.stringify({
      ...database,
      paginationState: cachedState
    })
  );
}

function getSearchQuery() {
  return document
    .getElementById('searchInput')
    .value
    .trim();
}

function restorePaginationState(parsed) {
  const cachedState =
    parsed && typeof parsed.paginationState === 'object'
      ? parsed.paginationState
      : {};

  for (const category of ['rekening', 'genshin']) {
    const items = database[category] || [];
    const saved = cachedState[category] || {};
    const total = Number(saved.total);

    paginationState[category].total =
      Number.isSafeInteger(total) && total >= items.length
        ? total
        : items.length;

    paginationState[category].query =
      typeof saved.query === 'string'
        ? saved.query
        : '';

    // Cache hanya menyimpan halaman yang pernah dimuat.
    // Saat offline jangan menawarkan load-more yang membutuhkan server.
    paginationState[category].hasMore = false;
  }
}

/* =========================
   META SELECT
========================= */

function updateMetaSelectOptions() {
  const select = document.getElementById('metaSelectInput');
  const customInput = document.getElementById('metaCustomInput');

  if (!select) return;

  select.innerHTML = '';

  const defaultOpt = document.createElement('option');

  defaultOpt.value = "";
  defaultOpt.textContent =

  defaultOpt.selected = true;

  select.appendChild(defaultOpt);

  const options =
    activeTab === 'rekening'
      ? BANK_OPTIONS
      : GAME_OPTIONS;

  options.forEach(opt => {
    const el = document.createElement('option');

    el.value = opt;
    el.textContent = opt;

    select.appendChild(el);
  });

  customInput.style.display = 'none';
  customInput.value = '';
}

function handleMetaSelectChange(selectEl) {
  const customInput =
    document.getElementById('metaCustomInput');

  if (selectEl.value === 'Lainnya...') {

    customInput.style.display = 'block';
    customInput.focus();

    customInput.style.display = 'none';

}

   THEME
========================= */

  const isDark =

if (localStorage.getItem('theme') === 'dark') {

/* =========================
   HOME
========================= */

function resetToHome() {

  const url = new URL(window.location.href);

  url.searchParams.delete('search');
  url.searchParams.delete('q');
  url.searchParams.delete('tab');

  window.history.replaceState(
    {},
    '',
    url.pathname + url.search + url.hash
  );

  document.getElementById('searchInput').value = '';

  switchTab('rekening');

  const resultList =
    document.getElementById('resultList');

  if (resultList) {
    resultList.scrollTop = 0;
  }

  showToast("Kembali ke Halaman Utama");
}

/* =========================
   URL
========================= */

function checkUrlParams() {

  const urlParams =
    new URLSearchParams(window.location.search);

  const searchQuery =
    urlParams.get('search') ||
    urlParams.get('q');

  const tabQuery =
    urlParams.get('tab');

  if (
    tabQuery &&
    (tabQuery === 'rekening' ||
     tabQuery === 'genshin')
  ) {

    activeTab = tabQuery;

    document
      .getElementById('tabRekening')
      .classList.toggle(
        'active',
        activeTab === 'rekening'
      );

    document
      .getElementById('tabGenshin')
      .classList.toggle(
        'active',
        activeTab === 'genshin'
      );

    document.getElementById('tabRekening').setAttribute(
      'aria-selected',
      String(activeTab === 'rekening')
    );

    document.getElementById('tabGenshin').setAttribute(
      'aria-selected',
      String(activeTab === 'genshin')
    );

    document.getElementById('tabRekening').tabIndex =
      activeTab === 'rekening' ? 0 : -1;

    document.getElementById('tabGenshin').tabIndex =
      activeTab === 'genshin' ? 0 : -1;
  }

  if (searchQuery) {
    document.getElementById('searchInput').value =
      searchQuery;
  }
}

function updateUrlParam(query) {

  const url =
    new URL(window.location.href);

  const currentQuery =
    url.searchParams.get('search') || '';

  if (query === currentQuery) {
    return;
  }

  if (query) {
    url.searchParams.set('search', query);
  } else {
    url.searchParams.delete('search');
  }

  window.history.replaceState(
    {},
    '',
    url.pathname +
    (url.search ? url.search : '') +
    url.hash
  );
}

/* =========================
   SERVER-SIDE PAGINATION
========================= */

async function fetchCategoryRecords(
  category,
  {
    reset = false,
    query = getSearchQuery(),
    silent = false
  } = {}
) {
  if (!['rekening', 'genshin'].includes(category)) {
    return false;
  }

  const state = paginationState[category];
  const cleanQuery = String(query || '').trim();

  const shouldReset =
    reset ||
    state.query !== cleanQuery;

  if (!shouldReset && !state.hasMore) {
    return true;
  }

  const offset =
    shouldReset
      ? 0
      : database[category].length;

  if (categoryControllers[category]) {
    categoryControllers[category].abort();
  }

  const controller = new AbortController();
  categoryControllers[category] = controller;

  let timedOut = false;
  const timeoutId = setTimeout(() => {
    timedOut = true;
    controller.abort();
  }, 7000);

  if (!silent) {
    setLoading(
      true,
      reset ? "Memuat data..." : "Memuat data berikutnya..."
    );
  }

  try {
    const params = new URLSearchParams({
      category,
      limit: String(PAGE_SIZE),
      offset: String(offset)
    });

    if (cleanQuery) {
      params.set('q', cleanQuery);
    }

    const res = await fetch(
      `${PROXY_URL}/records?${params.toString()}`,
      {
        signal: controller.signal,
        cache: 'no-store'
      }
    );

    if (!res.ok) {
      throw new Error(
        `Gagal mengambil data (${res.status})`
      );
    }

    const data = await res.json();

    if (!Array.isArray(data.records)) {
      throw new Error(
        "Format data D1 tidak sesuai"
      );
    }

    const incoming = migrateData(
      data.records,
      category
    );

    if (shouldReset) {
      database[category] = incoming;
    } else {
      const existingIds = new Set(
        database[category]
          .map(item => Number(item.id))
          .filter(id => Number.isSafeInteger(id) && id > 0)
      );

      for (const item of incoming) {
        const id = Number(item.id);

        if (
          Number.isSafeInteger(id) &&
          id > 0 &&
          existingIds.has(id)
        ) {
          continue;
        }

        database[category].push(item);

        if (Number.isSafeInteger(id) && id > 0) {
          existingIds.add(id);
        }
      }
    }

    state.total = Number(data.total || 0);
    state.query = cleanQuery;
    state.hasMore =
      database[category].length < state.total;

    offlineMode = false;
    database.lastUpdated =
      new Date().toISOString();

    cacheDatabase();

    return true;

  } catch (err) {
    if (
      err?.name === 'AbortError' &&
      !timedOut
    ) {
      return false;
    }

    console.warn(
      `Gagal mengambil ${category}:`,
      err
    );

    return false;

  } finally {
    clearTimeout(timeoutId);

    if (categoryControllers[category] === controller) {
      categoryControllers[category] = null;
    }

    if (!silent) {
      setLoading(false);
    }
  }
}

async function fetchOnlineDatabase() {
  const status =
    document.getElementById('statusBar');

  checkUrlParams();
  updateMetaSelectOptions();

  const initialQuery =
    getSearchQuery();

  setLoading(
    true,
    "Memuat data awal..."
  );

  try {
    status.innerText =
      "⏳ Mengambil data dari D1...";

    const [rekeningOk, genshinOk] =
      await Promise.all([
        fetchCategoryRecords(
          'rekening',
          {
            reset: true,
            query: initialQuery,
            silent: true
          }
        ),
        fetchCategoryRecords(
          'genshin',
          {
            reset: true,
            query: initialQuery,
            silent: true
          }
        )
      ]);

    if (!rekeningOk || !genshinOk) {
      throw new Error(
        "Sebagian data gagal dimuat"
      );
    }

    offlineMode = false;

    status.innerText =
      "🟢 Terhubung ke D1 — data dimuat bertahap.";

  } catch (err) {
    console.warn(
      "Menggunakan cache lokal:",
      err
    );

    const cached =
      localStorage.getItem(
        'cached_scammer_db'
      );

    if (cached) {
      try {
        const parsed =
          JSON.parse(cached);

        database = {
          rekening: migrateData(
            parsed.rekening || [],
            'rekening'
          ),
          genshin: migrateData(
            parsed.genshin || [],
            'genshin'
          ),
          lastUpdated:
            parsed.lastUpdated || null,
          infoTambahan:
            parsed.infoTambahan || []
        };

        restorePaginationState(parsed);
        offlineMode = true;

        status.innerText =
          "🟡 Mode Offline: cache parsial digunakan.";

      } catch (e) {
        database = {
          rekening: [],
          genshin: [],
          lastUpdated: null,
          infoTambahan: []
        };

        paginationState.rekening = {
          total: 0,
          query: '',
          hasMore: false
        };

        paginationState.genshin = {
          total: 0,
          query: '',
          hasMore: false
        };

        offlineMode = true;

        status.innerText =
          "🔴 Mode Offline: Cache tidak tersedia.";
      }

    } else {
      offlineMode = true;

      status.innerText =
        "🔴 Mode Offline: Tidak ada cache.";
    }

  } finally {
    setLoading(false);
  }

  filterData();
}

async function loadMoreRecords() {
  if (offlineMode) {
    showToast(
      "Mode offline: data tambahan membutuhkan koneksi."
    );
    return;
  }

  const ok = await fetchCategoryRecords(
    activeTab,
    {
      reset: false,
      query: getSearchQuery()
    }
  );

  if (ok) {
    filterData();
  } else {
    showToast(
      "⚠️ Gagal memuat data berikutnya."
    );
  }
}

async function runServerSearch() {
  const query =
    getSearchQuery();

  updateUrlParam(query);

  if (offlineMode) {
    // Saat offline, pencarian hanya pada cache yang tersedia.
    filterData();
    return;
  }

  const ok = await fetchCategoryRecords(
    activeTab,
    {
      reset: true,
      query
    }
  );

  if (ok) {
    filterData();
  } else {
    showToast(
      "⚠️ Pencarian gagal. Coba lagi."
    );
  }
}

  isAdmin = false;

  document.getElementById('authBtn').innerText =

async function toggleAdmin() {

  if (!isAdmin) {

    const pwdInput =
      document.getElementById(
        'adminPasswordInput'
      );

    pwdInput.value = '';

    openModalAccessible(
      'adminModal',
      '#adminPasswordInput'
    );

  } else {

        {
          method: 'POST',
          credentials: 'include'
        }
      );
    } catch (err) {
      console.warn(
        'Logout server gagal:',
        err
      );
    }

    exitAdminMode();

    showToast(
      "Keluar Mode Pemilik"
    );
  }
}

async function restoreAdminSession() {

  try {
    const res = await fetch(
      `${PROXY_URL}/auth/me`,
      {
        method: 'GET',
        credentials: 'include',
        cache: 'no-store'
      }
    );

    if (!res.ok) return;

    const data = await res.json();

    if (!data.authenticated) return;

    isAdmin = true;
    adminSessionActive = true;

    document.getElementById('authBtn').innerText =
      "🔓 Keluar Mode";

    document.getElementById('authBtn').setAttribute(
      'aria-pressed',
      'true'
    );

    document.getElementById('addBox').style.display =
      "flex";

    document.getElementById('newDateInput')
      .valueAsDate = new Date();

    updateMetaSelectOptions();

  } catch (err) {
    console.warn(
      'Tidak dapat memulihkan sesi admin:',
      err
    );
  }
}

function closeAdminModal() {
  closeModalAccessible('adminModal');
}

function handleAdminModalKeyDown(e) {

  if (e.key === 'Enter') {
    submitAdminLogin();
  }
}

async function submitAdminLogin() {

  const inputSecret =
    document.getElementById(
      'adminPasswordInput'
    ).value;

  if (
    !inputSecret ||
    inputSecret.trim() === ""
  ) {

    showToast(
      "⚠️ Password Admin wajib diisi!"
    );

    return;
  }

  const cleanSecret =
    inputSecret.trim();

  const submitBtn =
    document.querySelector(
      '#adminModal .btn-add'
    );

  const originalBtnText =
    submitBtn.innerText;

  submitBtn.disabled = true;
  submitBtn.innerText =
    "Verifikasi...";

  setLoading(
    true,
    "Memverifikasi admin..."
  );

  try {

    const res =
      await fetch(
        `${PROXY_URL}/auth/login`,
        {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type':
              'application/json'
          },
          body: JSON.stringify({
            password: cleanSecret
          })
        }
      );

    if (
      res.status === 401 ||
      res.status === 403
    ) {

      showToast(
        "❌ Password Admin Salah!"
      );

      return;
    }

    if (!res.ok) {

      throw new Error(
        "Gagal login ke server"
      );
    }

    /*
     * Tidak menyimpan password/token/session
     * ke JavaScript.
     *
     * Session ditangani oleh cookie
     * HttpOnly dari server.
     */
    isAdmin = true;
    adminSessionActive = true;

    document.getElementById('authBtn').innerText =
      "🔓 Keluar Mode";

    document.getElementById('authBtn').setAttribute(
      'aria-pressed',
      'true'
    );

    document.getElementById('addBox').style.display =
      "flex";

    document.getElementById('newDateInput')
      .valueAsDate = new Date();

    updateMetaSelectOptions();

    closeAdminModal();

    showToast(
      "Mode Pemilik Aktif"
    );

    filterData();

  } catch (err) {

    console.error(
      "Login error:",
      err
    );

    showToast(
      "⚠️ Gagal login: masalah jaringan/server."
    );

  } finally {

    submitBtn.disabled = false;
    submitBtn.innerText =
      originalBtnText;

    setLoading(false);
  }
}

/* =========================
   ADD DATA
========================= */

function handleInputKeyDown(e) {

  if (e.key === 'Enter') {
    addNumber();
  }
}

async function addNumber() {

  const input =
    document.getElementById(
      'newNumberInput'
    );

  const dateInput =
    document.getElementById(
      'newDateInput'
    );

  const btnAdd =
    document.getElementById(
      'btnAdd'
    );

  const selectMeta =
    document.getElementById(
      'metaSelectInput'
    );

  const customMetaInput =
    document.getElementById(
      'metaCustomInput'
    );

  if (!isAdmin || !adminSessionActive) {
    await showConfirm({
      title: "Sesi Admin Berakhir",
      message:
        "Sesi admin tidak lagi aktif. Silakan login kembali.",
      confirmText: "OK",
      danger: false
    });

    exitAdminMode();
    return;
  }

  let selectedMeta =
    selectMeta.value;

  const rawVal =
    input.value.trim();

  const dateVal =
    dateInput.value;

  if (!rawVal) {

    showToast(
      "⚠️ Masukkan nomor/UID baru!"
    );

    return;
  }

  if (
    !selectedMeta ||
    selectedMeta === ""
  ) {

    selectedMeta = "-";

  } else if (
    selectedMeta === 'Lainnya...'
  ) {

    selectedMeta =
      customMetaInput.value.trim();

    if (!selectedMeta) {
      selectedMeta = "-";
    }
  }

  if (!dateVal) {

    showToast(
      "⚠️ Tanggal wajib diisi!"
    );

    return;
  }

  const cleanVal =
    rawVal.replace(/\D/g, '');

  if (activeTab === 'genshin') {

    if (!/^\d{5,12}$/.test(cleanVal)) {

      showToast(
        "⚠️ UID harus 5 - 12 digit."
      );

      return;
    }

  } else if (
    activeTab === 'rekening'
  ) {

    if (!/^\d{5,25}$/.test(cleanVal)) {

      showToast(
        "⚠️ Nomor harus 5 - 25 digit."
      );

      return;
    }
  }


  btnAdd.disabled = true;
  btnAdd.innerText =
    "⏳ Menyimpan...";

  setLoading(true, "Menyimpan data...");

  try {

    const res = await fetch(
      `${PROXY_URL}/records`,
      {
        method: 'POST',
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          category: activeTab,
          nomor: cleanVal,
          tanggal: dateVal,
          meta: selectedMeta
        })
      }
    );

    let responseData = {};

    try {
      responseData = await res.json();
    } catch (_) {}

    if (
      res.status === 401 ||
      res.status === 403
    ) {
      await showConfirm({
        title: "Akses Ditolak",
        message:
          "Sesi Admin telah berakhir atau akses ditolak oleh server.",
        confirmText: "OK",
        danger: false
      });

      exitAdminMode();
      return;
    }

    if (res.status === 409) {
      showToast(
        "⚠️ Nomor/UID sudah ada!"
      );
      return;
    }

    if (!res.ok || !responseData.record) {
      throw new Error(
        responseData.error ||
        "Gagal menambahkan data"
      );
    }

    const newItem =
      migrateData(
        [responseData.record],
        activeTab
      )[0];

    if (!newItem) {
      throw new Error(
        "Respons record tidak valid"
      );
    }

    input.value = "";
    customMetaInput.value = "";

    updateMetaSelectOptions();

    document.getElementById(
      'searchInput'
    ).value = "";

    updateUrlParam("");

    const refreshed =
      await fetchCategoryRecords(
        activeTab,
        {
          reset: true,
          query: "",
          silent: true
        }
      );

    if (!refreshed) {
      database[activeTab].unshift(
        newItem
      );

      sortRecords(
        database[activeTab]
      );

      const state =
        paginationState[activeTab];

      state.query = "";
      state.total =
        Math.max(
          state.total + 1,
          database[activeTab].length
        );

      state.hasMore =
        database[activeTab].length <
        state.total;

      cacheDatabase();
    }

    filterData();

    document.getElementById('statusBar').innerText =
      "🟢 Tersimpan di D1!";

    showToast(
      "Data berhasil ditambahkan!"
    );

  } catch (err) {

    console.error(
      "Add record error:",
      err
    );

    await showConfirm({
      title: "Penyimpanan Gagal",
      message:
        "Data gagal ditambahkan karena masalah jaringan atau server.",
      confirmText: "OK",
      danger: false
    });

    document.getElementById('statusBar').innerText =
      "⚠️ Simpan gagal";

  } finally {

    btnAdd.disabled = false;
    btnAdd.innerText =
      "+ Simpan Data";

    setLoading(false);
  }
}

/* =========================
   CUSTOM CONFIRM
========================= */

let confirmResolver = null;

function showConfirm({
  title = "Konfirmasi",
  message = "Apakah Anda yakin?",
  confirmText = "OK",
  danger = true
} = {}) {

  return new Promise(resolve => {

    confirmResolver = resolve;

    document.getElementById(
      'confirmTitle'
    ).textContent = title;

    document.getElementById(
      'confirmMessage'
    ).textContent = message;

    const btn =
      document.getElementById(
        'confirmOkBtn'
      );

    btn.textContent =
      confirmText;

    btn.className =
      danger
        ? "btn btn-confirm-danger"
        : "btn btn-add";

    openModalAccessible(
      'confirmModal',
      '#confirmOkBtn'
    );
  });
}

function closeConfirmModal(result) {

  closeModalAccessible('confirmModal');

  if (confirmResolver) {

    const resolver =
      confirmResolver;

    confirmResolver = null;

    resolver(result);
  }
}

/* =========================
   DELETE
========================= */

async function deleteNumber(
  itemObj,
  btnEl
) {

  if (!isAdmin || !adminSessionActive) {
    await showConfirm({
      title: "Sesi Admin Berakhir",
      message:
        "Sesi admin tidak lagi aktif. Silakan login kembali.",
      confirmText: "OK",
      danger: false
    });

    exitAdminMode();
    return;
  }

  if (!itemObj || !Number.isSafeInteger(Number(itemObj.id))) {
    showToast(
      "⚠️ ID data tidak tersedia. Muat ulang halaman."
    );
    return;
  }

  const nomorStr =
    String(itemObj.nomor);

  const confirmed =
    await showConfirm({
      title: "Hapus Data?",
      message:
        `Data "${nomorStr}" akan dihapus dari database. Tindakan ini tidak dapat dibatalkan.`,
      confirmText: "Hapus",
      danger: true
    });

  if (!confirmed) return;

  if (btnEl) {
    btnEl.disabled = true;
  }

  setLoading(true, "Menghapus data...");

  try {

    const res = await fetch(
      `${PROXY_URL}/records/${itemObj.id}`,
      {
        method: 'DELETE',
        credentials: 'include'
      }
    );

    let responseData = {};

    try {
      responseData = await res.json();
    } catch (_) {}

    if (
      res.status === 401 ||
      res.status === 403
    ) {
      await showConfirm({
        title: "Akses Ditolak",
        message:
          "Sesi Admin telah berakhir atau akses ditolak oleh server.",
        confirmText: "OK",
        danger: false
      });

      exitAdminMode();
      return;
    }

    if (!res.ok) {
      throw new Error(
        responseData.error ||
        "Gagal menghapus data"
      );
    }

    const currentQuery =
      getSearchQuery();

    const refreshed =
      await fetchCategoryRecords(
        activeTab,
        {
          reset: true,
          query: currentQuery,
          silent: true
        }
      );

    if (!refreshed) {
      database[activeTab] =
        database[activeTab].filter(
          item =>
            Number(item.id) !==
            Number(itemObj.id)
        );

      const state =
        paginationState[activeTab];

      state.total =
        Math.max(
          0,
          state.total - 1
        );

      state.hasMore =
        database[activeTab].length <
        state.total;

      cacheDatabase();
    }

    filterData();

    document.getElementById('statusBar').innerText =
      "🟢 Data dihapus dari D1!";

    showToast(
      "Data dihapus!"
    );

  } catch (err) {

    console.error(
      "Delete record error:",
      err
    );

    await showConfirm({
      title: "Penghapusan Gagal",
      message:
        "Data gagal dihapus karena masalah jaringan atau server.",
      confirmText: "OK",
      danger: false
    });

    if (btnEl) {
      btnEl.disabled = false;
    }

  } finally {

    setLoading(false);
  }
}

/* =========================
   TABS
========================= */

async function switchTab(tab) {
  activeTab = tab;

  document
    .getElementById('tabRekening')
    .classList.toggle(
      'active',
      tab === 'rekening'
    );

  document
    .getElementById('tabGenshin')
    .classList.toggle(
      'active',
      tab === 'genshin'
    );

  const tabRekening =
    document.getElementById('tabRekening');

  const tabGenshin =
    document.getElementById('tabGenshin');

  tabRekening.setAttribute(
    'aria-selected',
    String(tab === 'rekening')
  );

  tabGenshin.setAttribute(
    'aria-selected',
    String(tab === 'genshin')
  );

  tabRekening.tabIndex =
    tab === 'rekening' ? 0 : -1;

  tabGenshin.tabIndex =
    tab === 'genshin' ? 0 : -1;

  const input =
    document.getElementById(
      'searchInput'
    );

  input.placeholder =
    tab === 'rekening'
      ? "Tulis nomor rekening di sini..."
      : "Tulis UID game di sini...";

  updateMetaSelectOptions();

  const query =
    getSearchQuery();

  const state =
    paginationState[tab];

  if (
    !offlineMode &&
    state.query !== query
  ) {
    const ok = await fetchCategoryRecords(
      tab,
      {
        reset: true,
        query
      }
    );

    if (!ok) {
      showToast(
        "⚠️ Gagal memuat tab."
      );
    }
  }

  filterData();
}

/* =========================
   SEARCH NORMALIZATION
========================= */

function normalizeSearchValue(value) {

  return String(value || '')
    .toLowerCase()
    .replace(/[^a-z0-9]/g, '');
}

/* =========================
   EVENT RESULT LIST
========================= */

document
  .getElementById('resultList')
  .addEventListener(
    'click',
    async (e) => {

      const target =
        e.target;

      /*
       * Pagination diperbaiki:
       * tombol sekarang benar-benar
       * bekerja karena elemen load-more
       * ditambahkan ke fragment/resultList.
       */
      if (
        target.classList.contains(
          'btn-load-more'
        )
      ) {

        target.disabled = true;
        target.textContent =
          "Memuat...";

        await loadMoreRecords();

        return;
      }

      const itemEl =
        target.closest(
          '.result-item'
        );

      if (!itemEl) return;

      const nomorStr =
        itemEl.dataset.nomor;

      const itemId =
        Number(itemEl.dataset.id || 0);

      const itemObj =
        database[activeTab].find(
          i =>
            (
              itemId > 0 &&
              Number(i.id) === itemId
            ) ||
            String(i.nomor) === nomorStr
        );

      if (
        target.classList.contains(
          'btn-delete'
        )
      ) {

        e.stopPropagation();

        await deleteNumber(
          itemObj,
          target
        );

      } else if (
        target.classList.contains(
          'btn-icon'
        )
      ) {

        e.stopPropagation();

        copyReportTemplate(
          itemObj || nomorStr
        );

      } else {

        copyToClipboard(
          nomorStr,
          `Disalin: ${nomorStr}`
        );
      }
    }
  );

/* =========================
   KEYBOARD RESULT ITEM
========================= */

document
  .getElementById('resultList')
  .addEventListener(
    'keydown',
    (e) => {
      if (
        (e.key === 'Enter' || e.key === ' ') &&
        e.target.classList.contains('number')
      ) {
        e.preventDefault();

        const itemEl =
          e.target.closest('.result-item');

        const nomorStr =
          itemEl?.dataset?.nomor || '';

        if (nomorStr) {
          copyToClipboard(
            nomorStr,
            `Disalin: ${nomorStr}`
          );
        }
      }
    }
  );

/* =========================
   COPY TEMPLATE
========================= */

function copyReportTemplate(itemObj) {

  const nomorStr =
    typeof itemObj === 'object'
      ? itemObj.nomor
      : itemObj;

  const metaStr =
    typeof itemObj === 'object'
      ? (
          itemObj.meta ||
          itemObj.bank ||
          itemObj.game ||
          '-'
        )
      : '-';

  const tanggalStr =
    typeof itemObj === 'object'
      ? itemObj.tanggal
      : '-';

  const template =
`🚨 LAPORAN PENIPUAN 🚨

Nomor/UID: ${nomorStr}
Platform/Bank: ${metaStr}
Tanggal Terdata: ${tanggalStr}

Hati-hati terhadap modus penipuan dengan informasi di atas!`;

  copyToClipboard(
    template,
    'Template laporan disalin!'
  );
}

/* =========================
   FILTER + PAGINATION
========================= */

function filterData() {
  try {
    const rawQuery =
      getSearchQuery()
        .toLowerCase();

    const cleanQuery =
      normalizeSearchValue(
        rawQuery
      );

    const resultList =
      document.getElementById(
        'resultList'
      );

    const counter =
      document.getElementById(
        'dataCounter'
      );

    while (
      resultList.firstChild
    ) {
      resultList.removeChild(
        resultList.firstChild
      );
    }

    const currentData =
      database[activeTab] || [];

    const state =
      paginationState[activeTab];

    let visibleData =
      currentData;

    // Hanya dipakai saat offline karena server tidak tersedia.
    if (offlineMode && rawQuery) {
      visibleData =
        currentData.filter(item => {
          const nomorStr =
            String(item?.nomor || '');

          const tanggalStr =
            String(
              item?.tanggal || ''
            ).toLowerCase();

          const metaStr =
            String(
              item?.meta ||
              item?.bank ||
              item?.game ||
              ''
            ).toLowerCase();

          const nomorNormalized =
            normalizeSearchValue(
              nomorStr
            );

          return (
            nomorStr
              .toLowerCase()
              .includes(rawQuery) ||
            (
              cleanQuery &&
              nomorNormalized.includes(
                cleanQuery
              )
            ) ||
            tanggalStr.includes(
              rawQuery
            ) ||
            metaStr.includes(
              rawQuery
            )
          );
        });
    }

    if (offlineMode) {
      const cachedTotal =
        Number(state.total || 0);

      counter.textContent =
        cachedTotal > visibleData.length
          ? `${visibleData.length}/${cachedTotal} Cache`
          : `${visibleData.length} Data`;
    } else {
      counter.textContent =
        `${state.total} Data`;
    }

    if (
      visibleData.length === 0
    ) {
      const emptyLi =
        document.createElement(
          'li'
        );

      emptyLi.className =
        'empty-msg';

      emptyLi.textContent =
        'Tidak ada data ditemukan.';

      resultList.appendChild(
        emptyLi
      );

      return;
    }

    const fragment =
      document.createDocumentFragment();

    visibleData.forEach(item => {
      const nomorStr =
        typeof item === 'object'
          ? String(item.nomor)
          : String(item);

      const tanggalStr =
        typeof item === 'object'
          ? String(
              item.tanggal || '-'
            )
          : '-';

      const metaStr =
        typeof item === 'object'
          ? String(
              item.meta ||
              item.bank ||
              item.game ||
              '-'
            )
          : '-';

      const li =
        document.createElement(
          'li'
        );

      li.className =
        'result-item';

      li.dataset.nomor =
        nomorStr;

      if (item && item.id) {
        li.dataset.id =
          String(item.id);
      }

      li.title =
        "Klik untuk menyalin nomor";

      const numberSpan =
        document.createElement(
          'span'
        );

      numberSpan.className =
        'number';

      numberSpan.setAttribute(
        'role',
        'button'
      );

      numberSpan.tabIndex = 0;

      numberSpan.setAttribute(
        'aria-label',
        `Salin nomor ${nomorStr}`
      );

      numberSpan.textContent =
        nomorStr;

      const rightContent =
        document.createElement(
          'div'
        );

      rightContent.className =
        'right-content';

      if (
        metaStr &&
        metaStr !== '-'
      ) {
        const metaSpan =
          document.createElement(
            'span'
          );

        metaSpan.className =
          'badge-meta';

        metaSpan.textContent =
          metaStr;

        rightContent.appendChild(
          metaSpan
        );
      }

      if (
        tanggalStr !== '-' &&
        tanggalStr.length > 0
      ) {
        const dateSpan =
          document.createElement(
            'span'
          );

        dateSpan.className =
          'badge-date';

        const dParts =
          tanggalStr.includes('-')
            ? tanggalStr.split('-')
            : [tanggalStr];

        const formattedDate =
          dParts.length === 3
            ? `${dParts[2]}/${dParts[1]}/${dParts[0]}`
            : tanggalStr;

        dateSpan.textContent =
          formattedDate;

        rightContent.appendChild(
          dateSpan
        );
      }

      const copyBtn =
        document.createElement(
          'button'
        );

      copyBtn.className =
        'btn-icon';

      copyBtn.title =
        'Salin Template Laporan';

      copyBtn.setAttribute(
        'aria-label',
        `Salin template laporan untuk ${nomorStr}`
      );

      copyBtn.textContent =
        '📢';

      rightContent.appendChild(
        copyBtn
      );

      if (isAdmin) {
        const deleteBtn =
          document.createElement(
            'button'
          );

        deleteBtn.className =
          'btn btn-delete';

        deleteBtn.textContent =
          'Hapus';

        deleteBtn.setAttribute(
          'aria-label',
          `Hapus data ${nomorStr}`
        );

        rightContent.appendChild(
          deleteBtn
        );
      }

      li.appendChild(
        numberSpan
      );

      li.appendChild(
        rightContent
      );

      fragment.appendChild(
        li
      );
    });

    if (
      !offlineMode &&
      state.hasMore
    ) {
      const loadMoreLi =
        document.createElement(
          'li'
        );

      loadMoreLi.className =
        'load-more-container';

      const loadMoreBtn =
        document.createElement(
          'button'
        );

      loadMoreBtn.className =
        'btn btn-load-more';

      const remaining =
        Math.max(
          0,
          state.total -
          currentData.length
        );

      loadMoreBtn.textContent =
        `Muat Lebih Banyak (${Math.min(
          PAGE_SIZE,
          remaining
        )})`;

      loadMoreBtn.setAttribute(
        'aria-label',
        `Muat ${Math.min(
          PAGE_SIZE,
          remaining
        )} data berikutnya`
      );

      loadMoreLi.appendChild(
        loadMoreBtn
      );

      fragment.appendChild(
        loadMoreLi
      );
    }

    resultList.appendChild(
      fragment
    );

  } catch (error) {
    console.error(
      "Terjadi masalah saat merender list:",
      error
    );

    const resultList =
      document.getElementById(
        'resultList'
      );

    while (
      resultList.firstChild
    ) {
      resultList.removeChild(
        resultList.firstChild
      );
    }

    const errLi =
      document.createElement(
        'li'
      );

    errLi.className =
      'empty-msg';

    errLi.style.color =
      '#e11d48';

    errLi.textContent =
      'Terjadi kendala saat membaca data. Coba muat ulang halaman.';

    resultList.appendChild(
      errLi
    );
  }
}

/* =========================
   SEARCH EVENT
========================= */

document
  .getElementById('searchInput')
  .addEventListener(
    'input',
    () => {
      clearTimeout(
        searchTimeout
      );

      searchTimeout =
        setTimeout(() => {
          runServerSearch();
        }, 300);
    }
  );

/* =========================
   KEYBOARD SEARCH
========================= */

document.addEventListener(
  'keydown',
  (e) => {

    const searchInput =
      document.getElementById(
        'searchInput'
      );

    if (
      e.key === '/' &&
      document.activeElement !== searchInput &&
      document.activeElement.tagName !== 'INPUT' &&
      document.activeElement.tagName !== 'TEXTAREA'
    ) {

      e.preventDefault();

      searchInput.focus();
    }
  }
);

/* =========================
   CLIPBOARD
========================= */

function copyToClipboard(
  text,
  toastMessage = 'Berhasil disalin!'
) {

  if (
    navigator.clipboard &&
    window.isSecureContext
  ) {

    navigator.clipboard
      .writeText(text)
      .then(() => {

        showToast(
          toastMessage
        );

      })
      .catch(err => {

        console.error(
          'Gagal menyalin:',
          err
        );

        fallbackCopy(
          text,
          toastMessage
        );
      });

  } else {

    fallbackCopy(
      text,
      toastMessage
    );
  }
}

function fallbackCopy(
  text,
  toastMessage
) {

  const textarea =
    document.createElement(
      'textarea'
    );

  textarea.value =
    text;

  textarea.style.position =
    'fixed';

  textarea.style.opacity =
    '0';

  document.body.appendChild(
    textarea
  );

  textarea.select();

  try {

    document.execCommand(
      'copy'
    );

    showToast(
      toastMessage
    );

  } catch (err) {

    console.error(
      'Gagal menyalin:',
      err
    );

    showToast(
      'Gagal menyalin ke clipboard.'
    );

  } finally {

    document.body.removeChild(
      textarea
    );
  }
}

/* =========================
   TOAST
========================= */

function showToast(message) {

  const toast =
    document.getElementById(
      'toast'
    );

  toast.textContent =
    message;

  toast.classList.add(
    'show'
  );

  setTimeout(() => {

    toast.classList.remove(
      'show'
    );

  }, 3000);
}

/* =========================
   QRIS
========================= */

function openQrisModal(src) {

  document.getElementById(
    'modalImg'
  ).src = src;

  openModalAccessible('qrisModal');
}

function closeQrisModal() {
  closeModalAccessible('qrisModal');
}

/* =========================
   ACCESSIBLE MODAL KEYBOARD
========================= */

document.addEventListener(
  'keydown',
  (event) => {
    const openModal = [
      'confirmModal',
      'adminModal',
      'qrisModal'
    ]
      .map(id => document.getElementById(id))
      .find(modal => modal && modal.style.display === 'flex');

    if (!openModal) return;

    if (event.key === 'Escape') {
      event.preventDefault();

      if (openModal.id === 'confirmModal') {
        closeConfirmModal(false);
      } else if (openModal.id === 'adminModal') {
        closeAdminModal();
      } else if (openModal.id === 'qrisModal') {
        closeQrisModal();
      }

      return;
    }

    trapFocus(event, openModal);
  }
);

/* =========================
   INITIAL LOAD
========================= */

(async function initApp() {
  await restoreAdminSession();
  await fetchOnlineDatabase();
})();
